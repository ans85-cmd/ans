<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>J]L[M - Willkommen</title>
    
    <!-- Apple Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="J]L[M">
    <meta name="theme-color" content="#1e3a8a">

    <!-- Schriften -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f1f5f9;
            --panel-bg: #ffffff;
            --primary-blue: #1e3a8a;
            --primary-blue-hover: #1e40af;
            --accent-gold: #b45309;
            --border-color: #cbd5e1;
            --text-dark: #0f172a;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Volle Ausnutzung des Handy-Displays (Fluid & Responsive, 0 Rand auf Smartphones) */
        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(180, 83, 9, 0.04) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .app-container {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            max-width: 100%;
            background: var(--panel-bg);
            border: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            position: relative;
        }

        @media (min-width: 520px) {
            .app-container {
                max-width: 520px;
                height: auto;
                border: 1px solid var(--border-color);
                border-radius: 20px;
                box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.08);
                padding: 40px 30px;
            }
        }

        /* Logo Animation */
        .logo-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 18px;
            animation: fadeInDown 0.6s ease;
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.5rem;
            color: var(--primary-blue);
            letter-spacing: 1.2px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 0.82rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .welcome-text {
            font-size: 0.92rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 30px;
        }

        /* Ladebalken */
        .loader-container {
            width: 100%;
            max-width: 320px;
            background: #e2e8f0;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
            position: relative;
            margin-left: auto;
            margin-right: auto;
        }

        .loader-fill {
            height: 100%;
            background: var(--primary-blue);
            width: 0%;
            border-radius: 4px;
            transition: width 0.05s linear;
        }

        .loader-status {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .manual-link {
            display: inline-block;
            margin-top: 25px;
            font-size: 0.85rem;
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .manual-link:hover {
            color: var(--primary-blue-hover);
            text-decoration: underline;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="logo-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="75" height="75">
              <defs>
                <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#1e3a8a" />
                  <stop offset="100%" stop-color="#0f172a" />
                </linearGradient>
                <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#fbbf24" />
                  <stop offset="100%" stop-color="#b45309" />
                </linearGradient>
              </defs>
              <circle cx="100" cy="100" r="86" fill="url(#blueGrad)" />
              <circle cx="100" cy="100" r="82" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
              <g transform="translate(100, 105)">
                <path d="M -55 -25 C -35 -30, -10 -20, 0 -10 L 0 35 C -10 25, -35 15, -55 20 Z" fill="#f8fafc" opacity="0.9"/>
                <path d="M 55 -25 C 35 -30, 10 -20, 0 -10 L 0 35 C 10 25, 35 15, 55 20 Z" fill="#f8fafc" opacity="0.9"/>
                <line x1="0" y1="-10" x2="0" y2="35" stroke="#cbd5e1" stroke-width="2"/>
              </g>
              <circle cx="70" cy="65" r="3" fill="#fbbf24" opacity="0.8"/>
              <circle cx="100" cy="55" r="3.5" fill="#fbbf24"/>
              <circle cx="130" cy="65" r="3" fill="#fbbf24" opacity="0.8"/>
              <line x1="70" y1="65" x2="100" y2="55" stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>
              <line x1="100" y1="55" x2="130" y2="65" stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>
              <text x="100" y="118" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">J</text>
            </svg>
        </div>

        <h1>J]L[M Lernplattform</h1>
        <div class="subtitle">Gesundheitspsychologie &amp; Kommunikation</div>
        
        <p class="welcome-text">
            Willkommen zurück! Deine Lerninhalte werden geladen...
        </p>

        <!-- Ladebalken -->
        <div class="loader-container">
            <div class="loader-fill" id="loaderFill"></div>
        </div>
        <div class="loader-status" id="loaderStatus">Lade Module (0%)</div>

        <div>
            <a href="LE_index.html" class="manual-link">Direkt zur Startseite wechseln &rarr;</a>
        </div>
    </div>

    <script>
        // Dynamisches Generieren des Apple Touch Icons via JavaScript (Umgeht iOS Data-URI Bugs)
        (function() {
            const canvas = document.createElement('canvas');
            canvas.width = 180;
            canvas.height = 180;
            const ctx = canvas.getContext('2d');
            
            // Hintergrund-Kreis (Dunkelblau)
            ctx.fillStyle = '#1e3a8a';
            ctx.beginPath();
            ctx.arc(90, 90, 86, 0, Math.PI * 2);
            ctx.fill();
            
            // Goldener Rand
            ctx.strokeStyle = '#fbbf24';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(90, 90, 80, 0, Math.PI * 2);
            ctx.stroke();
            
            // Buchstabe J in Gold/serif
            ctx.fillStyle = '#fbbf24';
            ctx.font = 'bold 90px Georgia, serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('J', 90, 95);

            // Als Apple Touch Icon verlinken
            const link = document.createElement('link');
            link.rel = 'apple-touch-icon';
            link.href = canvas.toDataURL('image/png');
            document.head.appendChild(link);
        })();

        // Automatischer Ladebalken mit Weiterleitung
        const duration = 1600; 
        const intervalTime = 30;
        const steps = duration / intervalTime;
        let currentStep = 0;

        const loaderFill = document.getElementById('loaderFill');
        const loaderStatus = document.getElementById('loaderStatus');

        const timer = setInterval(() => {
            currentStep++;
            const percent = Math.min(Math.round((currentStep / steps) * 100), 100);
            
            loaderFill.style.width = percent + '%';
            loaderStatus.innerText = `Lade Module (${percent}%)`;

            if (percent >= 100) {
                clearInterval(timer);
                window.location.href = 'LE_index.html';
            }
        }, intervalTime);
    </script>

</body>
</html>
