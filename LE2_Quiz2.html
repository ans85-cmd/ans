<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f1f5f9;
            --panel-bg: #ffffff;
            
            --primary-blue: #1e3a8a;       
            --primary-blue-hover: #1e40af;
            --accent-gold: #b45309;        
            
            --border-color: #cbd5e1;
            --text-dark: #0f172a;          
            --text-muted: #64748b;
            
            --correct-bg: #ecfdf5;
            --correct-border: #10b981;
            --correct-text: #065f46;
            
            --wrong-bg: #fef2f2;
            --wrong-border: #ef4444;
            --wrong-text: #991b1b;
            
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-card: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(180, 83, 9, 0.04) 0px, transparent 50%);
            background-attachment: fixed;
        }

        /* Fixer Zurück-Button */
        .fixed-back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--primary-blue);
            padding: 8px 14px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
            z-index: 1000;
        }

        .fixed-back-btn:hover {
            background: #eff6ff;
            border-color: var(--primary-blue);
            transform: translateY(-1px);
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
            border-radius: var(--radius-lg);
            padding: 32px 28px;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 18px;
            position: relative;
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.4rem;
            color: var(--primary-blue);
            letter-spacing: 1.5px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            margin-top: 16px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-blue);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .question-meta {
            font-size: 0.75rem;
            color: var(--accent-gold);
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 1.05rem;
            margin-bottom: 22px;
            line-height: 1.6;
            color: var(--text-dark);
            font-weight: 600;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-btn {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            color: var(--text-dark);
            padding: 14px 18px;
            border-radius: var(--radius-md);
            text-align: left;
            font-size: 0.92rem;
            line-height: 1.5;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-blue);
            background: #f1f5f9;
            transform: translateY(-1px);
        }

        .option-btn.selected {
            background: #eff6ff;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 1px var(--primary-blue);
            color: var(--primary-blue);
            font-weight: 500;
        }

        .option-btn.correct-ans {
            background: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            font-weight: 600;
        }

        .option-btn.wrong-ans {
            background: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .cyber-btn {
            width: 100%;
            background: var(--primary-blue);
            border: none;
            color: #ffffff;
            padding: 15px;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.2);
            transition: all 0.2s ease;
        }

        .cyber-btn:hover {
            background: var(--primary-blue-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 10px -1px rgba(30, 58, 138, 0.3);
        }

        .cyber-btn:active {
            transform: translateY(0);
        }

        .explanation {
            font-size: 0.88rem;
            background: #f8fafc;
            border-left: 4px solid var(--primary-blue);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            padding: 14px 16px;
            margin-bottom: 20px;
            color: #334155;
            line-height: 1.5;
            display: none;
        }
        
        .explanation.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-box {
            text-align: center;
            padding: 10px 0;
        }

        .result-score {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 3.5rem;
            margin: 10px 0;
            color: var(--primary-blue);
            font-weight: 800;
        }

        .result-status {
            font-size: 1.15rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .passed {
            color: #059669;
        }

        .failed {
            color: #dc2626;
        }
    </style>
</head>

<script>
    const questions = [
   {
    "frage": "31. Welche Aussage entspricht der Arbeitsdefinition von Baumann und Hurrelmann?",
    "a": "Gesundheitskommunikation umfasst den Austausch und die Vermittlung von Wissen, Erfahrungen, Meinungen und Gefühlen zu gesundheitsbezogenen Themen.",
    "b": "Gesundheitskommunikation bezeichnet ausschließlich ärztliche Aufklärung.",
    "c": "Gesundheitskommunikation muss immer eine konkrete Verhaltensänderung zum Ziel haben.",
    "d": "Gesundheitskommunikation findet ausschließlich zwischen zwei Personen statt.",
    "richtig": "a",
    "begruendung": "Die Definition ist bewusst sehr breit."
  },
  {
    "frage": "32. Welche Aussage zur gesundheitsrelevanten Kommunikation trifft zu?",
    "a": "Sie muss von medizinischem Fachpersonal ausgehen.",
    "b": "Sie kann Verhalten nur indirekt beeinflussen.",
    "c": "Sie gilt nur bei bewusst gesundheitsbezogener Absicht als Gesundheitskommunikation.",
    "d": "Sie kann Gesundheitsverhalten auch unabhängig von der Intention der Kommunikationspartner:innen beeinflussen.",
    "richtig": "d",
    "begruendung": "Intention = Absicht. Eine Wirkung auf Gesundheitsverhalten kann auch unbeabsichtigt entstehen."
  },
  {
    "frage": "33. Auf welchen Ebenen kann Gesundheitskommunikation stattfinden?",
    "a": "ausschließlich interpersonal und gesellschaftlich",
    "b": "interpersonal, organisational und gesellschaftlich",
    "c": "ausschließlich individuell und medizinisch",
    "d": "biologisch, psychologisch und sozial",
    "richtig": "b",
    "begruendung": "Zusätzlich kann sie direktpersönlich oder medienvermittelt erfolgen."
  },
  {
    "frage": "34. Welche Reihenfolge beschreibt die grundlegenden Funktionen der Gesundheitskommunikation am besten?",
    "a": "Verhalten → Information → Diagnose",
    "b": "Emotion → Krankheit → Rehabilitation",
    "c": "Information → Veränderung von Wahrnehmungen/Einstellungen/Überzeugungen → Verhaltensänderung",
    "d": "Risiko → Angst → Therapie",
    "richtig": "c",
    "begruendung": "Kommunikation soll nicht nur Wissen vermitteln, sondern letztlich Verhalten beeinflussen."
  },
  {
    "frage": "35. Was bedeutet eine persuasive Botschaft?",
    "a": "Eine Botschaft, die gezielt überzeugen bzw. Einstellungen oder Verhalten beeinflussen soll",
    "b": "eine ausschließlich sachliche medizinische Diagnose",
    "c": "eine Botschaft, die keine Emotionen enthalten darf",
    "d": "eine Kommunikation ohne Zielgruppe",
    "richtig": "a",
    "begruendung": "Persuasiv = überzeugend bzw. auf Einstellungs-/Verhaltensänderung gerichtet."
  },
  {
    "frage": "36. Wozu werden Narrative oder Testimonials in der Gesundheitskommunikation eingesetzt?",
    "a": "Um durch Geschichten oder Erfahrungsberichte stärkeren Selbstbezug und Identifikation zu erzeugen",
    "b": "ausschließlich zur wissenschaftlichen Evaluation",
    "c": "um Risikowahrscheinlichkeiten mathematisch zu berechnen",
    "d": "um Fachinformationen möglichst unpersönlich darzustellen",
    "richtig": "a",
    "begruendung": "Narrativ = Erzählung; Testimonial = Erfahrungs-/Zeugenbericht."
  },
  {
    "frage": "37. Welche der folgenden Gruppen nennt der Studienbrief als Anbieter bevölkerungsbezogener Gesundheitsinformationen?",
    "a": "ausschließlich niedergelassene Ärzt:innen",
    "b": "ausschließlich staatliche Behörden",
    "c": "unter anderem staatliche Institutionen, private Organisationen, pharmazeutische Industrie und Medien",
    "d": "ausschließlich Universitäten und Krankenkassen",
    "richtig": "c",
    "begruendung": "Gesundheitskommunikation hat sehr unterschiedliche Absender."
  },
  {
    "frage": "38. Warum ist die Quelle einer Gesundheitsinformation relevant?",
    "a": "Unterschiedliche Anbieter können unterschiedliche Zielsetzungen verfolgen, wodurch sich Ausgewogenheit, Vollständigkeit, Korrektheit und Gestaltung unterscheiden können.",
    "b": "Nur staatliche Quellen können korrekte Informationen enthalten.",
    "c": "Medieninformationen haben keinen Einfluss auf Gesundheitsverhalten.",
    "d": "Pharmaunternehmen dürfen keine Gesundheitsinformationen verbreiten.",
    "richtig": "a",
    "begruendung": "Absender und Interessen gehören deshalb zur kritischen Bewertung von Gesundheitsinformation."
  },
  {
    "frage": "39. Wodurch wird ein Risiko im Studienbrief grundsätzlich definiert?",
    "a": "durch die Wahrscheinlichkeit eines schädigenden Ereignisses und das negative Ausmaß seiner Konsequenzen",
    "b": "ausschließlich durch die Wahrscheinlichkeit",
    "c": "ausschließlich durch den emotionalen Eindruck",
    "d": "durch die Zahl bereits Erkrankter",
    "richtig": "a",
    "begruendung": "Risiko besitzt also eine Wahrscheinlichkeits- und eine Schadenskomponente."
  },
  {
    "frage": "40. Welche Merkmale gehören zu Slovics Dimension Schrecklichkeit der Gefahr (dread risk)?",
    "a": "neu, wissenschaftlich ungeklärt, verzögert",
    "b": "unkontrollierbar, furchteinflößend, potenziell tödlich und unfreiwillig",
    "c": "häufig, langandauernd und kumulativ",
    "d": "vertraut, freiwillig und gut erforscht",
    "richtig": "b",
    "begruendung": "Dread risk beschreibt die wahrgenommene Schrecklichkeit bzw. Bedrohlichkeit einer Gefahr."
  },
  {
    "frage": "41. Welche Merkmale gehören zu Slovics Dimension Unbekanntheit der Gefahr (unknown risk)?",
    "a": "ausschließlich hohe Sterblichkeit und Unkontrollierbarkeit",
    "b": "Freiwilligkeit und gerechte Verteilung",
    "c": "Neuartigkeit, wissenschaftliche Ungeklärtheit, Nicht-Wahrnehmbarkeit und verzögerte Wirkungen",
    "d": "Häufigkeit und Dauer der Exposition",
    "richtig": "c",
    "begruendung": "Unknown risk beschreibt, wie unbekannt bzw. schwer einschätzbar eine Gefahr ist."
  },
  {
    "frage": "42. Wann wird eine Gefahr von Laien tendenziell als besonders hohes Risiko wahrgenommen?",
    "a": "Wenn sie sowohl als sehr schrecklich als auch als sehr unbekannt eingeschätzt wird",
    "b": "ausschließlich wenn sie sehr häufig auftritt",
    "c": "wenn sie wissenschaftlich vollständig geklärt ist",
    "d": "ausschließlich wenn sie freiwillig eingegangen wird",
    "richtig": "a",
    "begruendung": "Beide Slovic-Dimensionen können die subjektive Risikowahrnehmung erhöhen."
  },
  {
    "frage": "43. Was ist das Ziel eines Furchtappells?",
    "a": "Angst grundsätzlich vollständig zu vermeiden",
    "b": "Bedrohung durch gesundheitliche Folgen hervorzuheben, um eine gewünschte Verhaltensänderung anzuregen",
    "c": "ausschließlich statistische Informationen zu vermitteln",
    "d": "Personen von Schutzmaßnahmen abzuhalten",
    "richtig": "b",
    "begruendung": "Ein Furchtappell soll die wahrgenommene Bedrohung bzw. persönliche Anfälligkeit erhöhen."
  },
  {
    "frage": "44. Warum können sehr drastische Furchtappelle ohne Handlungsmöglichkeit kontraproduktiv sein?",
    "a": "Weil Menschen Risiken dann immer überschätzen und sofort handeln.",
    "b": "Weil starke negative Emotionen defensive Abwehr statt Schutzverhalten auslösen können.",
    "c": "Weil Furcht grundsätzlich keinerlei Einfluss auf Verhalten besitzt.",
    "d": "Weil sie ausschließlich bei bereits Erkrankten wirken.",
    "richtig": "b",
    "begruendung": "Zu viel Bedrohung ohne Bewältigungsmöglichkeit kann Ablehnung, Ablenkung oder Risikoverharmlosung fördern."
  },
  {
    "frage": "45. Was bezeichnet der optimistische Fehlschluss?",
    "a": "Die eigene Gefährdung wird im Vergleich mit ähnlichen anderen Personen systematisch unterschätzt.",
    "b": "Das Risiko anderer Personen wird grundsätzlich unterschätzt.",
    "c": "Schutzmaßnahmen werden für wirksamer gehalten, als sie tatsächlich sind.",
    "d": "Positive Gesundheitsinformationen werden stärker erinnert.",
    "richtig": "a",
    "begruendung": "Typischer Gedanke: „Ja, das Risiko existiert – aber mich trifft es wahrscheinlich nicht.“"
  },
  {
    "frage": "46. Welche zwei grundlegenden Bewertungen laufen bei der Verarbeitung eines Furchtappells parallel?",
    "a": "Vergangenheit und Zukunft",
    "b": "Bedrohungsbewertung und Einschätzung der Kontrollierbarkeit bzw. Wirksamkeit von Gegenmaßnahmen",
    "c": "Diagnose und Behandlung",
    "d": "Verhalten und Persönlichkeit",
    "richtig": "b",
    "begruendung": "Die Person bewertet sowohl Gefahr/Anfälligkeit als auch Wirksamkeit und Umsetzbarkeit einer Schutzhandlung."
  },
  {
    "frage": "47. Eine Person hält eine Gefahr für persönlich relevant und glaubt zugleich, dass eine wirksame Schutzmaßnahme für sie umsetzbar ist. Was sollte nach dem Modell eher entstehen?",
    "a": "optimistischer Fehlschluss",
    "b": "Informationsvermeidung",
    "c": "Schutzmotivation und Gefahrenkontrolle",
    "d": "Furchtkontrolle",
    "richtig": "c",
    "begruendung": "Gefahrenkontrolle (danger control) richtet sich auf die tatsächliche Verringerung der Gefahr."
  },
  {
    "frage": "48. Eine Botschaft erzeugt sehr starke Furcht, aber die Person glaubt nicht, etwas Wirksames dagegen tun zu können. Welche Reaktion ist eher zu erwarten?",
    "a": "automatische Verhaltensänderung",
    "b": "Schutzmotivation",
    "c": "Furchtkontrolle mit defensiver Informationsverarbeitung",
    "d": "vollständige Gefahrenkontrolle",
    "richtig": "c",
    "begruendung": "Furchtkontrolle (fear control) bedeutet, dass eher das unangenehme Gefühl als die reale Gefahr „bearbeitet“ wird, z. B. durch Wegschauen oder Abwertung."
  },
  {
    "frage": "49. Was geschieht nach dem erweiterten parallelen Prozessmodell eher, wenn weder Gefahr noch Gegenmaßnahme als persönlich relevant wahrgenommen werden?",
    "a": "zwangsläufig Furchtkontrolle",
    "b": "maximale Schutzmotivation",
    "c": "Es kommt zu keiner weiteren relevanten Verarbeitung bzw. Handlung.",
    "d": "Die Person überschätzt automatisch ihr Risiko.",
    "richtig": "c",
    "begruendung": "Ohne wahrgenommene Relevanz fehlt der Anlass für Schutzverhalten."
  },
  {
    "frage": "50. Wie sollte ein Furchtappell nach dem Modell idealerweise gestaltet werden?",
    "a": "Eine relevante Bedrohung sollte zusammen mit einer wirksamen und realistisch umsetzbaren Schutzmaßnahme vermittelt werden.",
    "b": "Die Gefahr sollte maximal dramatisiert und Lösungen nicht erwähnt werden.",
    "c": "Schutzmaßnahmen sollten nur erwähnt werden, wenn keine Gefahr beschrieben wird.",
    "d": "Persönliche Anfälligkeit sollte möglichst heruntergespielt werden.",
    "richtig": "a",
    "begruendung": "Kurz: „Das kann dich betreffen – und du kannst sinnvoll etwas dagegen tun.“"
  },
  {
    "frage": "51. Bei welcher Art von Verhalten fanden sich Furchtappelle bzw. öffentliche Kommunikation tendenziell eher wirksam?",
    "a": "eher bei einmaligem oder episodischem Verhalten wie Impfungen als bei kontinuierlichem Gewohnheitsverhalten",
    "b": "ausschließlich bei täglichem Ernährungsverhalten",

    let currentQuestionIndex = 0;
    let score = 0; 
    let totalPossiblePoints = 0; 
    let userAnswers = {};

    function startQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        totalPossiblePoints = 0;
        userAnswers = {};

        questions.forEach((q, index) => {
            const correctArr = q.richtig.split(',').map(s => s.trim().toLowerCase());
            totalPossiblePoints += correctArr.length;
        });

        document.getElementById('startScreen').classList.remove('active');
        document.getElementById('quizScreen').classList.add('active');
        loadQuestion();
    }

    function loadQuestion() {
        resetState();
        const q = questions[currentQuestionIndex];
        
        document.getElementById('questionCounter').innerText = `Frage ${currentQuestionIndex + 1} / ${questions.length}`;
        document.getElementById('questionText').innerText = q.frage;

        const optionsList = document.getElementById('optionsList');
        const optionsKeys = ['a', 'b', 'c', 'd', 'e'];

        optionsKeys.forEach(key => {
            if (q[key]) {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `${key.toUpperCase()}) ${q[key]}`;
                btn.dataset.key = key;
                btn.onclick = () => toggleOption(btn);
                optionsList.appendChild(btn);
            }
        });

        updateProgress();
    }

    function toggleOption(btn) {
        if (btn.disabled) return;
        btn.classList.toggle('selected');
    }

    function resetState() {
        const optionsList = document.getElementById('optionsList');
        optionsList.innerHTML = '';
        const explanationBox = document.getElementById('explanationBox');
        explanationBox.classList.remove('show');
        explanationBox.innerText = '';
        const actionBtn = document.getElementById('actionBtn');
        actionBtn.innerText = 'Antworten prüfen';
        actionBtn.onclick = handleAction;
    }

    function handleAction() {
        const actionBtn = document.getElementById('actionBtn');
        const q = questions[currentQuestionIndex];
        const selectedButtons = document.querySelectorAll('.option-btn.selected');
        
        if (selectedButtons.length === 0) {
            alert('Bitte wähle mindestens eine Option aus.');
            return;
        }

        const correctArr = q.richtig.split(',').map(s => s.trim().toLowerCase());
        const optionButtons = document.querySelectorAll('.option-btn');

        optionButtons.forEach(btn => {
            btn.disabled = true;
            const key = btn.dataset.key;
            const isSelected = btn.classList.contains('selected');
            const isCorrect = correctArr.includes(key);

            if (isCorrect) {
                btn.classList.add('correct-ans');
                if (isSelected) {
                    score += 1;
                }
            } else {
                if (isSelected) {
                    btn.classList.add('wrong-ans');
                }
            }
        });

        const explanationBox = document.getElementById('explanationBox');
        explanationBox.innerText = "Begründung: " + q.begruendung;
        explanationBox.classList.add('show');

        actionBtn.innerText = 'Nächste Frage';
        actionBtn.onclick = nextQuestion;
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function updateProgress() {
        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        document.getElementById('progressFill').style.width = `${progressPercent}%`;
    }

    function showResults() {
        document.getElementById('quizScreen').classList.remove('active');
        document.getElementById('resultScreen').classList.add('active');
        document.getElementById('progressFill').style.width = '100%';

        const percentage = totalPossiblePoints > 0 ? Math.round((score / totalPossiblePoints) * 100) : 0;

        document.getElementById('resultScore').innerText = `${percentage}%`;

        const statusEl = document.getElementById('resultStatus');
        const detailsEl = document.getElementById('resultDetails');

        if (percentage >= 75) {
            statusEl.innerText = "Bestanden!";
            statusEl.className = "result-status passed";
        } else {
            statusEl.innerText = "Nicht bestanden";
            statusEl.className = "result-status failed";
        }

        detailsEl.innerText = `Du hast ${score} von ${totalPossiblePoints} möglichen Antwort-Punkten richtig erreicht.`;
    }

    function restartQuiz() {
        document.getElementById('resultScreen').classList.remove('active');
        document.getElementById('startScreen').classList.add('active');
    }
