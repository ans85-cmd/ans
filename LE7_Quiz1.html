<html lang="de">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f1f5f9;
            --panel-bg: #ffffff;
            
            --primary-blue: #1e3a8a;       
            --primary-blue-hover: #1e40af;
            --accent-gold: #b45309;        
            
            --border-color: #cbd5e1;
            --text-dark: #0f172a;          
            --text-muted: #64748b;
            
            --correct-bg: #ecfdf5;
            --correct-border: #10b981;
            --correct-text: #065f46;
            
            --wrong-bg: #fef2f2;
            --wrong-border: #ef4444;
            --wrong-text: #991b1b;
            
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-card: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(180, 83, 9, 0.04) 0px, transparent 50%);
            background-attachment: fixed;
        }

        /* Fixer Zurück-Button */
        .fixed-back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--primary-blue);
            padding: 8px 14px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
            z-index: 1000;
        }

        .fixed-back-btn:hover {
            background: #eff6ff;
            border-color: var(--primary-blue);
            transform: translateY(-1px);
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
            border-radius: var(--radius-lg);
            padding: 32px 28px;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 18px;
            position: relative;
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.4rem;
            color: var(--primary-blue);
            letter-spacing: 1.5px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            margin-top: 16px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-blue);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .question-meta {
            font-size: 0.75rem;
            color: var(--accent-gold);
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 1.05rem;
            margin-bottom: 22px;
            line-height: 1.6;
            color: var(--text-dark);
            font-weight: 600;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-btn {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            color: var(--text-dark);
            padding: 14px 18px;
            border-radius: var(--radius-md);
            text-align: left;
            font-size: 0.92rem;
            line-height: 1.5;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-blue);
            background: #f1f5f9;
            transform: translateY(-1px);
        }

        .option-btn.selected {
            background: #eff6ff;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 1px var(--primary-blue);
            color: var(--primary-blue);
            font-weight: 500;
        }

        .option-btn.correct-ans {
            background: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            font-weight: 600;
        }

        .option-btn.wrong-ans {
            background: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .cyber-btn {
            width: 100%;
            background: var(--primary-blue);
            border: none;
            color: #ffffff;
            padding: 15px;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.2);
            transition: all 0.2s ease;
        }

        .cyber-btn:hover {
            background: var(--primary-blue-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 10px -1px rgba(30, 58, 138, 0.3);
        }

        .cyber-btn:active {
            transform: translateY(0);
        }

        .explanation {
            font-size: 0.88rem;
            background: #f8fafc;
            border-left: 4px solid var(--primary-blue);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            padding: 14px 16px;
            margin-bottom: 20px;
            color: #334155;
            line-height: 1.5;
            display: none;
        }
        
        .explanation.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-box {
            text-align: center;
            padding: 10px 0;
        }

        .result-score {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 3.5rem;
            margin: 10px 0;
            color: var(--primary-blue);
            font-weight: 800;
        }

        .result-status {
            font-size: 1.15rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .passed {
            color: #059669;
        }

        .failed {
            color: #dc2626;
        }
    </style>
</head>

                <path d="M 55 -25 C 35 -30, 10 -20, 0 -10 L 0 35 C 10 25, 35 15, 55 20 Z" fill="#f8fafc" opacity="0.9"/>

    <div id="startScreen" class="screen active">
        <div class="question-text" style="text-align: center; margin-top: 10px;">
            Bereit für deine Lernsession?<br><span style="color: var(--primary-blue); font-weight: 700;">Lerneinheit 7</span>
        </div>
        <p style="font-size: 0.88rem; text-align: center; margin-bottom: 28px; color: var(--text-muted); line-height: 1.5;">

<script>
    const questions = [
  {
    "frage": "Was beschreibt Selbstregulation am treffendsten?",
    "a": "Die ausschließliche Unterdrückung spontaner Impulse",
    "b": "Die automatische Ausführung gelernter Reiz-Reaktions-Muster",
    "c": "Die Initiierung, Überwachung und Steuerung von Gedanken, Emotionen und Verhalten zur Zielerreichung",
    "d": "Die emotionale Verarbeitung einer Erkrankung",
    "richtig": "c",
    "begruendung": "Selbstregulation umfasst den gesamten zielgerichteten Steuerungsprozess.\nAK-Falle: Selbstregulation ist mehr als Selbstkontrolle."
  },
  {
    "frage": "Wie ist das persönliche Zielsystem nach Brunstein et al. organisiert?",
    "a": "Zyklisch",
    "b": "Dichotom",
    "c": "Linear",
    "d": "Hierarchisch",
    "richtig": "d",
    "begruendung": "Übergeordnete Ziele werden in konkretere untergeordnete Ziele gegliedert.\nAK-Falle: Hierarchisch wurde in der AK direkt gegen „zyklisch“ gestellt. \u00a0\nAFG_AK2026SoSe.pdf"
  },
  {
    "frage": "Was bedeutet vertikale Differenzierung eines Zielsystems?",
    "a": "Konkrete untergeordnete Ziele werden aus übergeordneten Zielen abgeleitet.",
    "b": "Verschiedene Ziele widersprechen sich nicht.",
    "c": "Ein unerreichbares Ziel wird aufgegeben.",
    "d": "Ein kurzfristiges Ziel wird durch ein langfristiges ersetzt.",
    "richtig": "a",
    "begruendung": "Beispiel: „gesund leben“ → „regelmäßig bewegen“."
  },
  {
    "frage": "Was bezeichnet horizontale Kohärenz?",
    "a": "Die Hierarchie zwischen Ober- und Unterzielen",
    "b": "Die Schwierigkeit eines Ziels",
    "c": "Die Widerspruchsfreiheit zwischen verschiedenen Zielen",
    "d": "Die zeitliche Stabilität eines Ziels",
    "richtig": "c",
    "begruendung": "AK-Falle: Widerspruchsfreiheit = horizontal, nicht vertikal. Genau so kam es in der AK. \u00a0\nAFG_AK2026SoSe.pdf"
  },
  {
    "frage": "Welche Aussage über die Wichtigkeit eines Ziels entspricht dem Studienbrief?",
    "a": "Wichtigkeit beeinflusst nur die Zielauswahl, nicht die Zielverfolgung.",
    "b": "Je wichtiger ein Ziel, desto ausgeprägter sind typischerweise die selbstregulativen Aktivitäten.",
    "c": "Besonders wichtige Ziele benötigen weniger Selbstregulation.",
    "d": "Die Zielwichtigkeit spielt ausschließlich bei kurzfristigen Zielen eine Rolle.",
    "richtig": "b",
    "begruendung": "Zielwichtigkeit ist eine zentrale Zieldimension und beeinflusst die Anstrengung."
  },
  {
    "frage": "Welche Aussage ist ein Annäherungsziel?",
    "a": "„Ich möchte keinen Herzinfarkt bekommen.“",
    "b": "„Ich möchte eine Grippeinfektion vermeiden.“",
    "c": "„Ich möchte verhindern, wieder zu rauchen.“",
    "d": "„Ich möchte einen Halbmarathon laufen.“",
    "richtig": "d",
    "begruendung": "Annäherungsziele richten sich auf einen gewünschten Zustand."
  },
  {
    "frage": "Was gehört zu einer adaptiven Zielanpassung, wenn ein Ziel dauerhaft nicht mehr erreichbar ist?",
    "a": "Nur die Anstrengung für das alte Ziel erhöhen",
    "b": "Das alte Ziel möglichst lange unverändert weiterverfolgen",
    "c": "Zielentbindung und Zielneubindung",
    "d": "Ausschließlich neue kurzfristige Ziele formulieren",
    "richtig": "c",
    "begruendung": "Erfolgreiche Anpassung bedeutet, ein unerreichbares Ziel loszulassen und neue realistische Ziele aufzubauen."
  },
  {
    "frage": "Welche Rolle kann Gesundheit im persönlichen Zielsystem spielen?",
    "a": "Ausschließlich als eigenständiges Ziel",
    "b": "Ausschließlich als Voraussetzung für andere Ziele",
    "c": "Ausschließlich als Folge erfolgreicher Selbstregulation",
    "d": "Als eigenes Ziel, als Voraussetzung für andere Ziele und als Unterstützung weiterer Ziele",
    "richtig": "d",
    "begruendung": "Der Studienbrief beschreibt alle drei Funktionen."
  },
  {
    "frage": "Was bezeichnet Selbstwirksamkeitserwartung?",
    "a": "Die Erwartung, dass eine Belohnung langfristig größer wird",
    "b": "Die Einschätzung, ein erforderliches Verhalten selbst erfolgreich ausführen zu können",
    "c": "Die Fähigkeit, emotionale Reaktionen vollständig auszuschalten",
    "d": "Die automatische Ausführung einer Gewohnheit",
    "richtig": "b",
    "begruendung": "Selbstwirksamkeit bezieht sich auf das Vertrauen in die eigene Handlungsfähigkeit."
  },
  {
    "frage": "Was bedeutet Belohnungsaufschub?",
    "a": "Ein langfristiges Ziel auf einen späteren Zeitpunkt verschieben",
    "b": "Zwei gleichwertige Ziele nacheinander verfolgen",
    "c": "Auf eine kurzfristige positive Verhaltensfolge zugunsten einer bedeutsameren langfristigen Verstärkung verzichten",
    "d": "Eine Belohnung grundsätzlich vermeiden",
    "richtig": "c",
    "begruendung": "AK-Falle: Belohnungsaufschub, nicht „Zielaufschub“. \u00a0\nAFG_AK2026SoSe.pdf"
  },
  {
    "frage": "Für welche Ziele sind selbstregulative Kompetenzen laut AK besonders bedeutsam?",
    "a": "Nur spontane Ziele",
    "b": "Nur kurzfristige Ziele",
    "c": "Ausschließlich unbewusste Ziele",
    "d": "Langfristige gesundheitsbezogene Ziele",
    "richtig": "d",
    "begruendung": "Langfristige Gesundheitsziele konkurrieren häufig mit kurzfristig attraktiven Belohnungen. \u00a0\nAFG_AK2026SoSe.pdf"
  },
  {
    "frage": "Was ist der zentrale Mechanismus in der Selbstregulationstheorie von Carver & Scheier?",
    "a": "Klassische Konditionierung",
    "b": "Fortlaufender Vergleich von Soll- und Ist-Zustand",
    "c": "Ausschließliche Unterdrückung negativer Emotionen",
    "d": "Ausschließliche Verstärkung erfolgreichen Verhaltens",
    "richtig": "b",
    "begruendung": "Abweichungen zwischen gewünschtem und aktuellem Zustand führen zur Anpassung von Verhaltensstrategien."
  },
  {
    "frage": "Welche Funktion haben Emotionen bei Carver & Scheier?",
    "a": "Sie beeinträchtigen Selbstregulation grundsätzlich.",
    "b": "Sie spielen für Zielverfolgung keine Rolle.",
    "c": "Sie liefern Rückmeldung über Fortschritte oder fehlenden Erfolg bei der Zielerreichung.",
    "d": "Sie ersetzen den Vergleich von Soll- und Ist-Zustand.",
    "richtig": "c",
    "begruendung": "Positive bzw. negative Gefühlslagen können Hinweise auf den Verlauf der Zielerreichung geben."
  },
  {
    "frage": "Was versteht man nach Baumeister & Heatherton unter Selbstkontrolle?",
    "a": "Die gesamte Regulation persönlicher Ziele",
    "b": "Das Setzen möglichst konkreter Ziele",
    "c": "Die Fähigkeit, eigenen Impulsen, Wünschen oder Gewohnheiten zu widerstehen oder sie zu verändern",
    "d": "Die automatische Anpassung an Kontextreize",
    "richtig": "c",
    "begruendung": "AK-Falle: Genau diese Definition wurde in der AK geprüft. \u00a0\nAFG_AK2026SoSe.pdf"
  },
  {
    "frage": "Welche Abgrenzung ist korrekt?",
    "a": "Selbstkontrolle umfasst den Gesamtprozess; Selbstregulation nur Impulskontrolle.",
    "b": "Beide Begriffe bezeichnen im Studienbrief exakt dasselbe.",
    "c": "Selbstkontrolle beschreibt ausschließlich die Zielsetzung.",
    "d": "Selbstregulation ist der Gesamtprozess der Zielsteuerung; Selbstkontrolle ist eine Ressource bzw. Fähigkeit innerhalb dieses Prozesses.",
    "richtig": "d",
    "begruendung": "Merker: Regulation = steuern, Kontrolle = widerstehen."
  },
  {
    "frage": "Welche Annahme gehört zum Strength Model of Self-Control?",
    "a": "Selbstkontrolle steht unbegrenzt zur Verfügung.",
    "b": "Selbstkontrolle ist für jede Verhaltensdomäne völlig unabhängig.",
    "c": "Selbstkontrolle wird als begrenzte globale Ressource betrachtet.",
    "d": "Selbstkontrolle beruht ausschließlich auf Gewohnheiten.",
    "richtig": "c",
    "begruendung": "Im Modell wird Selbstkontrolle mit einem Muskel verglichen, dessen Leistungsfähigkeit nach Beanspruchung abnimmt."
  },
  {
    "frage": "Was bezeichnet Ego-Depletion?",
    "a": "Dauerhaften Verlust jeglicher Selbstkontrollfähigkeit",
    "b": "Einen Zustand vorübergehend verminderter Selbstkontrollressourcen nach Beanspruchung",
    "c": "Einen Konflikt zwischen zwei gleich wichtigen Zielen",
    "d": "Eine besonders starke Gewohnheitsbildung",
    "richtig": "b",
    "begruendung": "Nach dem Ressourcenmodell soll starke vorherige Selbstkontrollbeanspruchung die nachfolgende Selbstkontrolle reduzieren."
  },
  {
    "frage": "Welche Aussage zum Strength Model ist korrekt?",
    "a": "Seine Annahmen gelten inzwischen als zweifelsfrei bestätigt.",
    "b": "Das Modell wurde empirisch vollständig widerlegt.",
    "c": "Es erklärt nachweislich jede Form gesundheitsbezogenen Verhaltens.",
    "d": "Es gibt unterstützende Befunde, aber auch konzeptuelle und methodische Kritik.",
    "richtig": "d",
    "begruendung": "Der Studienbrief stellt das Modell ausdrücklich als umstritten dar."
  },
  {
    "frage": "Warum reichen bewusste Selbstregulationsmodelle zur Erklärung von Gesundheitsverhalten nicht immer aus?",
    "a": "Weil Gesundheitsverhalten nie bewusst gesteuert wird",
    "b": "Weil auch Impulse, automatische Prozesse und Gewohnheiten Verhalten beeinflussen",
    "c": "Weil Gesundheitsziele grundsätzlich unbewusst sind",
    "d": "Weil Selbstregulation nur bei Krankheit vorkommt",
    "richtig": "b",
    "begruendung": "Menschen handeln häufig trotz besseren Wissens anders als geplant."
  },
  {
    "frage": "Welche beiden Systeme unterscheidet die Zweisystem-Theorie von Hofmann et al.?",
    "a": "Kognitives und behaviorales System",
    "b": "Emotionales und behaviorales System",
    "c": "Reflektives und impulsives System",
    "d": "Rationales und soziales System",
    "richtig": "c",
    "begruendung": "AK-Falle: Kein behaviorales System. Genau das war eine AK-Aussage. \u00a0\nAFG_AK2026SoSe.pdf"
  },
  {
    "frage": "Welche Eigenschaft gehört zum reflektiven System?",
    "a": "Automatisierte Informationsverarbeitung mit sehr geringem Ressourcenbedarf",
    "b": "Ausschließliche Steuerung durch hedonistische Affekte",
    "c": "Starre Reaktion auf frühere Lernerfahrungen",
    "d": "Bewusste Planung und Bewertung unter Nutzung kognitiver Ressourcen",
    "richtig": "d",
    "begruendung": "Das reflektive System ist langsam und ressourcenintensiver, dafür flexibel."
  },
  {
    "frage": "Welche Eigenschaft gehört zum impulsiven System?",
    "a": "Schnelle automatisierte Verarbeitung und Aktivierung gelernter Verhaltenstendenzen",
    "b": "Ausführliche rationale Bewertung aller Verhaltensfolgen",
    "c": "Besonders hoher Bedarf an Gedächtniskapazität",

    let currentQuestionIndex = 0;
    let score = 0; 
    let totalPossiblePoints = 0; 
    let userAnswers = {};

    function startQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        totalPossiblePoints = 0;
        userAnswers = {};

        questions.forEach((q, index) => {
            const correctArr = q.richtig.split(',').map(s => s.trim().toLowerCase());
            totalPossiblePoints += correctArr.length;
        });

        document.getElementById('startScreen').classList.remove('active');
        document.getElementById('quizScreen').classList.add('active');
        loadQuestion();
    }

    function loadQuestion() {
        resetState();
        const q = questions[currentQuestionIndex];
        
        document.getElementById('questionCounter').innerText = `Frage ${currentQuestionIndex + 1} / ${questions.length}`;
        document.getElementById('questionText').innerText = q.frage;

        const optionsList = document.getElementById('optionsList');
        const optionsKeys = ['a', 'b', 'c', 'd', 'e'];

        optionsKeys.forEach(key => {
            if (q[key]) {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `${key.toUpperCase()}) ${q[key]}`;
                btn.dataset.key = key;
                btn.onclick = () => toggleOption(btn);
                optionsList.appendChild(btn);
            }
        });

        updateProgress();
    }

    function toggleOption(btn) {
        if (btn.disabled) return;
        btn.classList.toggle('selected');
    }

    function resetState() {
        const optionsList = document.getElementById('optionsList');
        optionsList.innerHTML = '';
        const explanationBox = document.getElementById('explanationBox');
        explanationBox.classList.remove('show');
        explanationBox.innerText = '';
        const actionBtn = document.getElementById('actionBtn');
        actionBtn.innerText = 'Antworten prüfen';
        actionBtn.onclick = handleAction;
    }

    function handleAction() {
        const actionBtn = document.getElementById('actionBtn');
        const q = questions[currentQuestionIndex];
        const selectedButtons = document.querySelectorAll('.option-btn.selected');
        
        if (selectedButtons.length === 0) {
            alert('Bitte wähle mindestens eine Option aus.');
            return;
        }

        const correctArr = q.richtig.split(',').map(s => s.trim().toLowerCase());
        const optionButtons = document.querySelectorAll('.option-btn');

        optionButtons.forEach(btn => {
            btn.disabled = true;
            const key = btn.dataset.key;
            const isSelected = btn.classList.contains('selected');
            const isCorrect = correctArr.includes(key);

            if (isCorrect) {
                btn.classList.add('correct-ans');
                if (isSelected) {
                    score += 1;
                }
            } else {
                if (isSelected) {
                    btn.classList.add('wrong-ans');
                }
            }
        });

        const explanationBox = document.getElementById('explanationBox');
        explanationBox.innerText = "Begründung: " + q.begruendung;
        explanationBox.classList.add('show');

        actionBtn.innerText = 'Nächste Frage';
        actionBtn.onclick = nextQuestion;
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function updateProgress() {
        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        document.getElementById('progressFill').style.width = `${progressPercent}%`;
    }

    function showResults() {
        document.getElementById('quizScreen').classList.remove('active');
        document.getElementById('resultScreen').classList.add('active');
        document.getElementById('progressFill').style.width = '100%';

        const percentage = totalPossiblePoints > 0 ? Math.round((score / totalPossiblePoints) * 100) : 0;

        document.getElementById('resultScore').innerText = `${percentage}%`;

        const statusEl = document.getElementById('resultStatus');
        const detailsEl = document.getElementById('resultDetails');

        if (percentage >= 75) {
            statusEl.innerText = "Bestanden!";
            statusEl.className = "result-status passed";
        } else {
            statusEl.innerText = "Nicht bestanden";
            statusEl.className = "result-status failed";
        }

        detailsEl.innerText = `Du hast ${score} von ${totalPossiblePoints} möglichen Antwort-Punkten richtig erreicht.`;
    }

    function restartQuiz() {
        document.getElementById('resultScreen').classList.remove('active');
        document.getElementById('startScreen').classList.add('active');
    }
</script>

</body>
</html>
