<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J]L[M</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f1f5f9;
            --panel-bg: #ffffff;
            
            --primary-blue: #1e3a8a;       
            --primary-blue-hover: #1e40af;
            --accent-gold: #b45309;        
            
            --border-color: #cbd5e1;
            --text-dark: #0f172a;          
            --text-muted: #64748b;
            
            --correct-bg: #ecfdf5;
            --correct-border: #10b981;
            --correct-text: #065f46;
            
            --wrong-bg: #fef2f2;
            --wrong-border: #ef4444;
            --wrong-text: #991b1b;
            
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-card: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(180, 83, 9, 0.04) 0px, transparent 50%);
            background-attachment: fixed;
        }

        /* Fixer Zurück-Button */
        .fixed-back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--primary-blue);
            padding: 8px 14px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
            z-index: 1000;
        }

        .fixed-back-btn:hover {
            background: #eff6ff;
            border-color: var(--primary-blue);
            transform: translateY(-1px);
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
            border-radius: var(--radius-lg);
            padding: 32px 28px;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 18px;
            position: relative;
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.4rem;
            color: var(--primary-blue);
            letter-spacing: 1.5px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            margin-top: 16px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-blue);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .question-meta {
            font-size: 0.75rem;
            color: var(--accent-gold);
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 1.05rem;
            margin-bottom: 22px;
            line-height: 1.6;
            color: var(--text-dark);
            font-weight: 600;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-btn {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            color: var(--text-dark);
            padding: 14px 18px;
            border-radius: var(--radius-md);
            text-align: left;
            font-size: 0.92rem;
            line-height: 1.5;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-blue);
            background: #f1f5f9;
            transform: translateY(-1px);
        }

        .option-btn.selected {
            background: #eff6ff;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 1px var(--primary-blue);
            color: var(--primary-blue);
            font-weight: 500;
        }

        .option-btn.correct-ans {
            background: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            font-weight: 600;
        }

        .option-btn.wrong-ans {
            background: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .cyber-btn {
            width: 100%;
            background: var(--primary-blue);
            border: none;
            color: #ffffff;
            padding: 15px;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.2);
            transition: all 0.2s ease;
        }

        .cyber-btn:hover {
            background: var(--primary-blue-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 10px -1px rgba(30, 58, 138, 0.3);
        }

        .cyber-btn:active {
            transform: translateY(0);
        }

        .explanation {
            font-size: 0.88rem;
            background: #f8fafc;
            border-left: 4px solid var(--primary-blue);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            padding: 14px 16px;
            margin-bottom: 20px;
            color: #334155;
            line-height: 1.5;
            display: none;
        }
        
        .explanation.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-box {
            text-align: center;
            padding: 10px 0;
        }

        .result-score {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 3.5rem;
            margin: 10px 0;
            color: var(--primary-blue);
            font-weight: 800;
        }

        .result-status {
            font-size: 1.15rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .passed {
            color: #059669;
        }

        .failed {
            color: #dc2626;
        }
    </style>
</head>
<body>

<a href="LE_index.html" class="fixed-back-btn">

<div class="app-container">
    <header>
        <div style="display: flex; justify-content: center; margin-bottom: 8px;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="65" height="65">
              <defs>
                <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#1e3a8a" />
                  <stop offset="100%" stop-color="#0f172a" />
                </linearGradient>
                <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#fbbf24" />
                  <stop offset="100%" stop-color="#b45309" />
                </linearGradient>
              </defs>
              <circle cx="100" cy="100" r="86" fill="url(#blueGrad)" />
              <circle cx="100" cy="100" r="82" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
              <g transform="translate(100, 105)">
                <path d="M -55 -25 C -35 -30, -10 -20, 0 -10 L 0 35 C -10 25, -35 15, -55 20 Z" fill="#f8fafc" opacity="0.9"/>
                <path d="M 55 -25 C 35 -30, 10 -20, 0 -10 L 0 35 C 10 25, 35 15, 55 20 Z" fill="#f8fafc" opacity="0.9"/>
                <line x1="0" y1="-10" x2="0" y2="35" stroke="#cbd5e1" stroke-width="2"/>
              </g>
              <circle cx="70" cy="65" r="3" fill="#fbbf24" opacity="0.8"/>
              <circle cx="100" cy="55" r="3.5" fill="#fbbf24"/>
              <circle cx="130" cy="65" r="3" fill="#fbbf24" opacity="0.8"/>
              <line x1="70" y1="65" x2="100" y2="55" stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>
              <line x1="100" y1="55" x2="130" y2="65" stroke="#fbbf24" stroke-width="1.5" opacity="0.5"/>
              <text x="100" y="118" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">J</text>
            </svg>
        </div>
        <h1>Quiz - LE5</h1>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </header>

    <div id="startScreen" class="screen active">
        <div class="question-text" style="text-align: center; margin-top: 10px;">
            Bereit für deine Lernsession?<br><span style="color: var(--primary-blue); font-weight: 700;">Lerneinheit 5</span>
        </div>
        <p style="font-size: 0.88rem; text-align: center; margin-bottom: 28px; color: var(--text-muted); line-height: 1.5;">
            Bestanden ab 75% korrekten Antworten.
        </p>
        <button class="cyber-btn" onclick="startQuiz()">Lernen starten</button>
    </div>

    <div id="quizScreen" class="screen">
        <div class="question-meta" id="questionCounter">Frage 1 / 30</div>
        <div class="question-text" id="questionText">Lade Frage...</div>
        <div class="options-list" id="optionsList"></div>
        <div class="explanation" id="explanationBox"></div>
        <button class="cyber-btn" id="actionBtn" onclick="handleAction()">Antworten prüfen</button>
    </div>

    <div id="resultScreen" class="screen">
        <div class="result-box">
            <h2 style="color: var(--text-dark); font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 700;">Auswertung</h2>
            <div class="result-score" id="resultScore">0%</div>
            <div class="result-status" id="resultStatus">Status</div>
            <p id="resultDetails" style="font-size: 0.92rem; margin-bottom: 25px; color: var(--text-muted); line-height: 1.5;"></p>
            <button class="cyber-btn" onclick="restartQuiz()">Nochmal lernen</button>
        </div>
    </div>
</div>

<script>
    const questions = [
  {
    "frage": "Eine Studie untersucht, wie stark sich Studierende aktuell gestresst fühlen. Welches Forschungsziel liegt vor?",
    "a": "Prognostisch",
    "b": "Explanativ",
    "c": "Deskriptiv",
    "d": "Induktiv",
    "richtig": "c",
    "begruendung": "Deskriptive Forschung beschreibt empirische Sachverhalte, ohne sie zwingend vorherzusagen oder kausal zu erklären. SB2_K3-Forschung.pdf\nAK-Falle: „Wie stark?“, „wie häufig?“, „wie verteilt?“ → meistens deskriptiv."
  },
  {
    "frage": "Eine Studie untersucht, ob Gesundheitskompetenz den zukünftigen Krankheitsverlauf vorhersagen kann. Welche Ausrichtung hat sie?",
    "a": "Prognostisch",
    "b": "Induktiv",
    "c": "Deskriptiv",
    "d": "Qualitativ",
    "richtig": "a",
    "begruendung": "Prognostische Forschung zielt auf die Vorhersage zukünftiger Entwicklungen. SB2_K3-Forschung.pdf\nAK-Falle: Genau diese Vertauschung „prognostisch vs. induktiv“ wurde bereits in der AK verwendet.\n\nAFG_AK2026SoSe.pdf"
  },
  {
    "frage": "Welche Forschungsfrage ist am ehesten explanativ?",
    "a": "Wie häufig treiben Studierende Sport?",
    "b": "Wie wird sich der Anteil körperlich aktiver Studierender entwickeln?",
    "c": "Welche Themen nennen Studierende in Interviews zu Sport?",
    "d": "Warum bewegen sich bestimmte Studierendengruppen zu wenig?",
    "richtig": "d",
    "begruendung": "Explanative Forschung versucht kausale Zusammenhänge zu erklären.\n\nSB2_K3-Forschung.pdf"
  },
  {
    "frage": "Was bedeutet eine induktive Forschungsorientierung?",
    "a": "Eine bestehende Theorie wird anhand vorab formulierter Hypothesen geprüft.",
    "b": "Aus empirischen Beobachtungen werden Theorien oder Modelle entwickelt.",
    "c": "Zukünftige Entwicklungen werden vorhergesagt.",
    "d": "Eine Intervention wird randomisiert geprüft.",
    "richtig": "b",
    "begruendung": "Induktion bedeutet vereinfacht: von Beobachtungen bzw. Einzelfällen zu allgemeineren Modellen oder Theorien.\n\nSB2_K3-Forschung.pdf"
  },
  {
    "frage": "Eine Studie untersucht, ob Selbstwirksamkeit den Zusammenhang zwischen körperlicher Aktivität und Ernährung vermittelt. Welchem Forschungsschwerpunkt wird das zugeordnet?",
    "a": "Maßnahmenentwicklung",
    "b": "Prognostische Forschung",
    "c": "Strukturierung von Wissen",
    "d": "Deskriptive Forschung",
    "richtig": "c",
    "begruendung": "Die Untersuchung von Mediations- und Moderationseffekten gehört im Studienbrief zur Strukturierung von Wissen. SB2_K3-Forschung.pdf\nAK-Falle: Genau diese Zuordnung wurde in der SoSe-2026-AK geprüft.\n\nAFG_AK2026SoSe.pdf"
  },
  {
    "frage": "Eine bestehende Theorie soll darauf geprüft werden, welchen Anteil der Varianz körperlicher Aktivität sie erklärt. Welcher Schwerpunkt liegt vor?",
    "a": "Induktive Theorieentwicklung",
    "b": "Qualitative Exploration",
    "c": "Explanative Forschung im engeren Sinne",
    "d": "Theorie-/Modellprüfung bzw. statistische Modellierung",
    "richtig": "d",
    "begruendung": "Hier wird ein bereits vorhandenes Modell empirisch überprüft. SB2_K3-Forschung.pdf\nAK-Falle: „Erklärt Varianz“ klingt nach „explanativ“, wurde in der AK aber ausdrücklich der Modellprüfung/statistischen Modellierung zugeordnet.\n\nAFG_AK2026SoSe.pdf"
  },
  {
    "frage": "Was kennzeichnet ein klassisches Experiment besonders?",
    "a": "Messung ausschließlich zu einem Zeitpunkt",
    "b": "Manipulation der unabhängigen Variable und randomisierte Gruppenzuteilung",
    "c": "Ausschließlich natürliche Gruppen ohne Eingriff",
    "d": "Ausschließlich retrospektive Datenerhebung",
    "richtig": "b",
    "begruendung": "Experimente prüfen Ursache-Wirkungs-Hypothesen, indem die UV (unabhängige Variable) manipuliert und Teilnehmende randomisiert Bedingungen zugeordnet werden.\n\nSB2_K3-Forschung.pdf"
  },
  {
    "frage": "Wozu dient ein Manipulationstest?",
    "a": "Er prüft, ob die Stichprobe repräsentativ ist.",
    "b": "Er kontrolliert ausschließlich Dropouts.",
    "c": "Er prüft, ob die experimentelle Manipulation tatsächlich die beabsichtigte Veränderung bewirkt hat.",
    "d": "Er ersetzt die Randomisierung.",
    "richtig": "c",
    "begruendung": "Wenn z. B. Risikowahrnehmung manipuliert wird, muss geprüft werden, ob sich die Gruppen anschließend tatsächlich in der Risikowahrnehmung unterscheiden.\n\nSB2_K3-Forschung.pdf"
  },
  {
    "frage": "Was ist das wichtigste Ziel der Randomisierung?",
    "a": "Die Teilnehmenden über ihre Gruppenzugehörigkeit im Unklaren zu lassen.",
    "b": "Die ökologische Validität zu erhöhen.",
    "c": "Den Untersuchungszeitraum zu verkürzen.",
    "d": "Systematische Ausgangsunterschiede zwischen den Gruppen möglichst zu verhindern.",
    "richtig": "d",
    "begruendung": "Risiko- und Schutzfaktoren sowie andere Merkmale sollen möglichst zufällig und gleichmäßig auf die Gruppen verteilt sein. SB2_K3-Forschung.pdf\nAK-Falle: Randomisierung = Zuteilung, Verblindung = Wissen über Zuteilung."
  },
  {
    "frage": "Beschäftigte entscheiden selbst, ob sie an einem Stressmanagementkurs teilnehmen. Anschließend sind Teilnehmende weniger gestresst als Nichtteilnehmende. Warum ist die Wirksamkeitsaussage problematisch?",
    "a": "Weil jede Intervention eine Placebogruppe benötigt.",
    "b": "Weil sich the Gruppen bereits vor der Intervention systematisch unterschieden haben könnten.",
    "c": "Weil Stress niemals per Selbstbericht gemessen werden darf.",
    "d": "Weil Wirksamkeit nur in Querschnittstudien geprüft werden kann.",
    "richtig": "b",
    "begruendung": "Personen mit mehr Zeit oder besseren Selbstfürsorgestrategien könnten eher teilnehmen und bereits vorher weniger belastet sein. Dann entsteht ein methodisches Artefakt (scheinbarer Effekt durch Methodik).\n\nSB2_K3-Forschung.pdf"
  },
  {
    "frage": "Wofür werden RCTs (randomisierte kontrollierte Studien) besonders häufig eingesetzt?",
    "a": "Zur qualitativen Exploration neuer Themen",
    "b": "Zur reinen Beschreibung einer Population",
    "c": "Zur Überprüfung der Wirksamkeit von Interventionen",
    "d": "Zur Erhebung ausschließlich genetischer Faktoren",
    "richtig": "c",
    "begruendung": "RCTs sind eine Form des Experiments und werden häufig für Wirksamkeitsprüfungen eingesetzt. SB2_K3-Forschung.pdf\nAK-Falle: Wurde direkt in der SoSe-2026-AK geprüft.\n\nAFG_AK2026SoSe.pdf"
  },
  {
    "frage": "Was kennzeichnet ein Wartelisten-Kontrollgruppen-Design?",
    "a": "Die Kontrollgruppe erhält grundsätzlich nie eine Behandlung.",
    "b": "Kontroll- und Interventionsgruppe wechseln zufällig während der Studie.",
    "c": "Die Kontrollgruppe erhält ausschließlich ein Placebo.",
    "d": "Die Kontrollgruppe erhält die Intervention erst zu einem späteren Zeitpunkt.",
    "richtig": "d",
    "begruendung": "Die Kontrollgruppe wartet zunächst und erhält nach der relevanten Erhebung ebenfalls die Behandlung.\n\nSB2_K3-Forschung.pdf"
  },
  {
    "frage": "Welche Reihenfolge entspricht einem typischen RCT?",
    "a": "Intervention → Randomisierung → Prätest → Posttest",
    "b": "Prätest → Intervention → Posttest → gegebenenfalls Follow-up",
    "c": "Posttest → Prätest → Intervention → Follow-up",
    "d": "Follow-up → Intervention → Prätest",
    "richtig": "b",
    "begruendung": "Der Prätest erfasst den Ausgangswert, der Posttest die Veränderung nach der Behandlung und ein späteres Follow-up (Nachuntersuchung) die längerfristige Wirkung.\n\nSB2_K3-Forschung.pdf"
  },
  {
    "frage": "Was bedeutet doppelte Verblindung?",
    "a": "Zwei Kontrollgruppen erhalten unterschiedliche Placebos.",
    "b": "Weder Prätest noch Posttest werden ausgewertet.",
    "c": "Weder Teilnehmende noch Versuchsleitung kennen die jeweilige Gruppenzugehörigkeit.",
    "d": "Zwei Forschende führen unabhängig voneinander dieselbe Analyse durch.",
    "richtig": "c",
    "begruendung": "Doppelte Verblindung reduziert Erwartungseffekte auf Seiten der Teilnehmenden und der Versuchsleitung.\n\nSB2_K3-Forschung.pdf"
  },
  {
    "frage": "Welcher Vorteil experimenteller Studien ist besonders zentral?",
    "a": "Sie haben grundsätzlich die höchste ökologische Validität.",
    "b": "Sie sind besonders günstig und einfach durchzuführen.",
    "c": "Sie benötigen keine Kontrollgruppen.",
    "d": "Sie liefern die stärkste Evidenz für Ursache-Wirkungs-Beziehungen.",
    "richtig": "d",
    "begruendung": "Randomisierung, Kontrolle und Manipulation erhöhen insbesondere die interne Validität (Sicherheit des Ursache-Wirkungs-Schlusses innerhalb der Studie).\n\nSB2_K3-Forschung.pdf"
  },
  {
    "frage": "Was beschreibt interne Validität am besten?",
    "a": "Wie gut eine Studie den Alltag abbildet",
    "b": "Wie sicher eine beobachtete Veränderung auf die manipulierte unabhängige Variable zurückgeführt werden kann",
    "c": "Wie gut Ergebnisse auf andere Populationen übertragbar sind",
    "d": "Wie groß die Stichprobe ist",
    "richtig": "b",
    "begruendung": "Hohe interne Validität bedeutet, dass alternative Ursachen möglichst ausgeschlossen wurden.\n\nSB2_K3-Forschung.pdf"
  },
  {
    "frage": "Welche Aussage über Laborexperimente trifft zu?",
    "a": "Sie besitzen grundsätzlich geringe interne Validität.",
    "b": "Sie erlauben keinerlei kausale Schlüsse.",
    "c": "Ihre ökologische Validität kann wegen der künstlichen Umgebung eingeschränkt sein.",
    "d": "Sie finden immer in der natürlichen Lebensumwelt statt.",
    "richtig": "c",
    "begruendung": "Stark kontrollierte Bedingungen erhöhen oft die interne Kontrolle, können aber die ökologische Validität (Alltagsnähe) reduzieren.\n\nSB2_K3-Forschung.pdf"
  },
  {
    "frage": "Was unterscheidet ein Quasiexperiment wesentlich vom klassischen Experiment?",
    "a": "Quasiexperimente besitzen keine abhängige Variable.",
    "b": "Quasiexperimente sind immer retrospektiv.",
    "c": "Quasiexperimente messen keine Gruppenunterschiede.",
    "d": "Es fehlt die randomisierte Zuteilung zu den Untersuchungsgruppen.",
    "richtig": "d",
    "begruendung": "Häufig werden natürlich bestehende Gruppen verglichen, wenn Randomisierung unmöglich oder ethisch problematisch ist.\n\nSB2_K3-Forschung.pdf"
  },
  {
    "frage": "Teilnehmende sollen sich vorstellen, gerade eine schwere Krankheitsdiagnose erhalten zu haben, und anschließend ihre Reaktion angeben. Welches Design ist das?",
    "a": "Querschnittstudie",
    "b": "Kohortenstudie",
    "c": "Analogexperiment",

    let currentQuestionIndex = 0;
    let score = 0; 
    let totalPossiblePoints = 0; 
    let userAnswers = {};

    function startQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        totalPossiblePoints = 0;
        userAnswers = {};

        questions.forEach((q, index) => {
            const correctArr = q.richtig.split(',').map(s => s.trim().toLowerCase());
            totalPossiblePoints += correctArr.length;
        });

        document.getElementById('startScreen').classList.remove('active');
        document.getElementById('quizScreen').classList.add('active');
        loadQuestion();
    }

    function loadQuestion() {
        resetState();
        const q = questions[currentQuestionIndex];
        
        document.getElementById('questionCounter').innerText = `Frage ${currentQuestionIndex + 1} / ${questions.length}`;
        document.getElementById('questionText').innerText = q.frage;

        const optionsList = document.getElementById('optionsList');
        const optionsKeys = ['a', 'b', 'c', 'd', 'e'];

        optionsKeys.forEach(key => {
            if (q[key]) {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `${key.toUpperCase()}) ${q[key]}`;
                btn.dataset.key = key;
                btn.onclick = () => toggleOption(btn);
                optionsList.appendChild(btn);
            }
        });

        updateProgress();
    }

    function toggleOption(btn) {
        if (btn.disabled) return;
        btn.classList.toggle('selected');
    }

    function resetState() {
        const optionsList = document.getElementById('optionsList');
        optionsList.innerHTML = '';
        const explanationBox = document.getElementById('explanationBox');
        explanationBox.classList.remove('show');
        explanationBox.innerText = '';
        const actionBtn = document.getElementById('actionBtn');
        actionBtn.innerText = 'Antworten prüfen';
        actionBtn.onclick = handleAction;
    }

    function handleAction() {
        const actionBtn = document.getElementById('actionBtn');
        const q = questions[currentQuestionIndex];
        const selectedButtons = document.querySelectorAll('.option-btn.selected');
        
        if (selectedButtons.length === 0) {
            alert('Bitte wähle mindestens eine Option aus.');
            return;
        }

        const correctArr = q.richtig.split(',').map(s => s.trim().toLowerCase());
        const optionButtons = document.querySelectorAll('.option-btn');

        optionButtons.forEach(btn => {
            btn.disabled = true;
            const key = btn.dataset.key;
            const isSelected = btn.classList.contains('selected');
            const isCorrect = correctArr.includes(key);

            if (isCorrect) {
                btn.classList.add('correct-ans');
                if (isSelected) {
                    score += 1;
                }
            } else {
                if (isSelected) {
                    btn.classList.add('wrong-ans');
                }
            }
        });

        const explanationBox = document.getElementById('explanationBox');
        explanationBox.innerText = "Begründung: " + q.begruendung;
        explanationBox.classList.add('show');

        actionBtn.innerText = 'Nächste Frage';
        actionBtn.onclick = nextQuestion;
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function updateProgress() {
        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        document.getElementById('progressFill').style.width = `${progressPercent}%`;
    }

    function showResults() {
        document.getElementById('quizScreen').classList.remove('active');
        document.getElementById('resultScreen').classList.add('active');
        document.getElementById('progressFill').style.width = '100%';

        const percentage = totalPossiblePoints > 0 ? Math.round((score / totalPossiblePoints) * 100) : 0;

        document.getElementById('resultScore').innerText = `${percentage}%`;

        const statusEl = document.getElementById('resultStatus');
        const detailsEl = document.getElementById('resultDetails');

        if (percentage >= 75) {
            statusEl.innerText = "Bestanden!";
            statusEl.className = "result-status passed";
        } else {
            statusEl.innerText = "Nicht bestanden";
            statusEl.className = "result-status failed";
        }

        detailsEl.innerText = `Du hast ${score} von ${totalPossiblePoints} möglichen Antwort-Punkten richtig erreicht.`;
    }

    function restartQuiz() {
        document.getElementById('resultScreen').classList.remove('active');
        document.getElementById('startScreen').classList.add('active');
    }
</script>

</body>
</html>
