<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J]L[M - In Arbeit</title>
    
    <!-- PWA Manifest & App-Icons -->
    <link rel="manifest" href='data:application/manifest+json,{
        "name": "J]L[M",
        "short_name": "J]L[M",
        "start_url": "LE_index.html",
        "display": "standalone",
        "background_color": "#f1f5f9",
        "theme_color": "#1e3a8a",
        "icons": [{
            "src": "data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 200 200%27%3E%3Ccircle cx=%27100%27 cy=%27100%27 r=%2786%27 fill=%27%231e3a8a%27/%3E%3Ccircle cx=%27100%27 cy=%27100%27 r=%2782%27 fill=%27none%27 stroke=%27%23fbbf24%27 stroke-width=%272%27/%3E%3Ctext x=%27100%27 y=%27118%27 font-family=%27Georgia, serif%27 font-size=%2752%27 font-weight=%27bold%27 fill=%27%23fbbf24%27 text-anchor=%27middle%27%3EJ%3C/text%3E%3C/svg%3E",
            "sizes": "192x192 512x512",
            "type": "image/svg+xml"
        }]
    }'>
    
    <!-- Meta-Tags für iOS & Android App-Feeling -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Jennys Moodle">
    <meta name="theme-color" content="#1e3a8a">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 200 200%27%3E%3Ccircle cx=%27100%27 cy=%27100%27 r=%2786%27 fill=%27%231e3a8a%27/%3E%3Ccircle cx=%27100%27 cy=%27100%27 r=%2782%27 fill=%27none%27 stroke=%27%23fbbf24%27 stroke-width=%272%27/%3E%3Ctext x=%27100%27 y=%27118%27 font-family=%27Georgia, serif%27 font-size=%2752%27 font-weight=%27bold%27 fill=%27%23fbbf24%27 text-anchor=%27middle%27%3EJ%3C/text%3E%3C/svg%3E">

    <!-- Modernes Schriftduo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f1f5f9;
            --panel-bg: #ffffff;
            --primary-blue: #1e3a8a;
            --primary-blue-hover: #1e40af;
            --accent-gold: #b45309;
            --border-color: #cbd5e1;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-card: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(180, 83, 9, 0.04) 0px, transparent 50%);
            background-attachment: fixed;
        }

        /* Fixer Zurück-Button */
        .fixed-back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--primary-blue);
            padding: 8px 14px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
            z-index: 1000;
        }

        .fixed-back-btn:hover {
            background: #eff6ff;
            border-color: var(--primary-blue);
            transform: translateY(-1px);
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
            border-radius: var(--radius-lg);
            padding: 30px 24px;
            position: relative;
            text-align: center;
        }

        /* Moodle Header Mini */
        .moodle-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .brand-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.15rem;
            color: var(--primary-blue);
            font-weight: 700;
            text-transform: uppercase;
            line-height: 1.2;
            text-align: left;
        }

        .brand-subtitle {
            font-size: 0.7rem;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            text-align: left;
        }

        /* Work-in-Progress Card Styling */
        .work-card {
            background: linear-gradient(135deg, #f8fafc 0%, #eff6ff 100%);
            border: 1px solid #bfdbfe;
            border-left: 4px solid var(--primary-blue);
            border-radius: var(--radius-md);
            padding: 24px 20px;
            margin-bottom: 25px;
        }

        .work-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .work-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary-blue);
            margin-bottom: 8px;
        }

        .work-text {
            font-size: 0.88rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* Zurück-Button auf der Karte */
        .action-btn {
            display: inline-block;
            width: 100%;
            background: var(--primary-blue);
            color: #ffffff;
            padding: 14px;
            border-radius: var(--radius-md);
            font-size: 0.92rem;
            font-weight: 600;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.2);
            margin-bottom: 15px;
        }

        .action-btn:hover {
            background: var(--primary-blue-hover);
            transform: translateY(-1px);
        }

        footer {
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px solid #e2e8f0;
            padding-top: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Fixer Zurück-Button oben links -->
    <a href="LE_index.html" class="fixed-back-btn">
        <span>←</span> Zur Startseite
    </a>

    <div class="app-container">
        <!-- Moodle Header -->
        <div class="moodle-header">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="38" height="38">
                <defs>
                    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#1e3a8a" />
                        <stop offset="100%" stop-color="#0f172a" />
                    </linearGradient>
                    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#fbbf24" />
                        <stop offset="100%" stop-color="#b45309" />
                    </linearGradient>
                </defs>
                <circle cx="100" cy="100" r="86" fill="url(#blueGrad)" />
                <circle cx="100" cy="100" r="82" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
                <text x="100" y="118" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">J</text>
            </svg>
            <div>
                <div class="brand-title">J]L[M</div>
                <div class="brand-subtitle">Lernplattform</div>
            </div>
        </div>

        <!-- In Arbeit Box -->
        <div class="work-card">
            <div class="work-icon">🛠️</div>
            <div class="work-title">Seite in Bearbeitung</div>
            <div class="work-text">
                Hier wird gerade fleißig getüftelt, geschrieben und formatiert! Dieser Bereich steht dir in Kürze mit allen Inhalten zur Verfügung.
            </div>
        </div>

        <!-- Haupt-Aktionsbutton -->
        <a href="LE_index.html" class="action-btn">
            Zurück zur Startseite
        </a>

        <footer>
            ans85-cmd &bull; WiSe26
        </footer>
    </div>

</body>
</html>
