    <style>
        :root {
            --bg-color: #f1f5f9;
            --panel-bg: #ffffff;
            
            --primary-blue: #1e3a8a;       
            --primary-blue-hover: #1e40af;
            --accent-gold: #b45309;        
            
            --border-color: #cbd5e1;
            --text-dark: #0f172a;          
            --text-muted: #64748b;
            
            --correct-bg: #ecfdf5;
            --correct-border: #10b981;
            --correct-text: #065f46;
            
            --wrong-bg: #fef2f2;
            --wrong-border: #ef4444;

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {

        .fixed-back-btn {

            top: 20px;
            left: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);

            align-items: center;

            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
            z-index: 1000;
        }

        .fixed-back-btn:hover {
            background: #eff6ff;
            border-color: var(--primary-blue);
            transform: translateY(-1px);
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
            border-radius: var(--radius-lg);

            font-size: 1.4rem;
            color: var(--primary-blue);
            letter-spacing: 1.5px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            margin-top: 16px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-blue);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .question-meta {
            font-size: 0.75rem;
            color: var(--accent-gold);
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 1.05rem;
            margin-bottom: 22px;
            line-height: 1.6;
            color: var(--text-dark);
            font-weight: 600;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-btn {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            color: var(--text-dark);
            padding: 14px 18px;
            border-radius: var(--radius-md);
            text-align: left;
            font-size: 0.92rem;
            line-height: 1.5;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-blue);
            background: #f1f5f9;
            transform: translateY(-1px);
        }

        .option-btn.selected {
            background: #eff6ff;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 1px var(--primary-blue);
            color: var(--primary-blue);
            font-weight: 500;
        }

        .option-btn.correct-ans {
            background: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            font-weight: 600;
        }

        .option-btn.wrong-ans {
            background: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .cyber-btn {
            width: 100%;
            background: var(--primary-blue);
            border: none;
            color: #ffffff;
            padding: 15px;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.2);
            transition: all 0.2s ease;
        }

        .cyber-btn:hover {
            background: var(--primary-blue-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 10px -1px rgba(30, 58, 138, 0.3);
        }

        .cyber-btn:active {
            transform: translateY(0);
        }

        .explanation {
            font-size: 0.88rem;
            background: #f8fafc;
            border-left: 4px solid var(--primary-blue);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            padding: 14px 16px;
            margin-bottom: 20px;
            color: #334155;
            line-height: 1.5;
            display: none;
        }
        
        .explanation.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-box {
            text-align: center;
            padding: 10px 0;
        }

        .result-score {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 3.5rem;
            margin: 10px 0;
            color: var(--primary-blue);
            font-weight: 800;
        }

        .result-status {
            font-size: 1.15rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .passed {
            color: #059669;
        }

        .failed {
            color: #dc2626;
        }
    </style>
</head>

<script>
    const questions = [
  {
    "frage": "Welche Aussage beschreibt soziale Integration am treffendsten?",
    "a": "Sie beschreibt die subjektive Erwartung, bei Bedarf Hilfe zu erhalten.",
    "b": "Sie bezeichnet die Einbettung in ein soziales Netzwerk und fokussiert quantitative und strukturelle Merkmale sozialer Beziehungen.",
    "c": "Sie bezeichnet ausschließlich tatsächlich ausgeführte Hilfehandlungen.",
    "d": "Sie beschreibt die Bewertung der Wirksamkeit bereits erhaltener Hilfe.",
    "richtig": "b",
    "begruendung": "Bei sozialer Integration geht es um Struktur und Umfang sozialer Beziehungen, z. B. Zahl und Häufigkeit von Kontakten. Soziale Unterstützung betrifft dagegen deren qualitative und funktionale Seite[cite: 9]. AK-Falle: Integration ≠ Unterstützung[cite: 9]."
  },
  {
    "frage": "Welches Merkmal gehört nicht zu den vier Netzwerkdimensionen nach Laireiter?",
    "a": "Struktur des Netzwerks",
    "b": "Beziehungen zu den Netzwerkmitgliedern",
    "c": "Inhalt der Beziehungen",
    "d": "Dichte des Netzwerks",
    "richtig": "d",
    "begruendung": "Die vier Dimensionen sind Struktur, Beziehungen, Inhalt und Evaluation (Bewertung). Die Dichte (Anteil vorhandener an möglichen Beziehungen) ist zwar ein Netzwerkparameter, aber keine der vier Laireiter-Dimensionen[cite: 9]. AK-Falle: Ein Begriff kann im Kapitel richtig sein und trotzdem nicht zum gefragten Modell gehören[cite: 9]."
  },
  {
    "frage": "Was kennzeichnet soziale Unterstützung?",
    "a": "Sie betrifft qualitative und funktionale Aspekte sozialer Beziehungen und soll Belastungen bzw. Aufgaben bewältigen helfen.",
    "b": "Sie wird ausschließlich über die Anzahl sozialer Kontakte bestimmt.",
    "c": "Sie ist gleichbedeutend mit sozialer Integration.",
    "d": "Sie liegt nur vor, wenn ein Problem objektiv vollständig beseitigt wird.",
    "richtig": "a",
    "begruendung": "Unterstützung kann einen Problemzustand verändern oder lediglich sein Ertragen erleichtern. Sie muss das Problem also nicht vollständig beseitigen[cite: 9]. AK-Falle: „Nur wenn das Problem gelöst wird“ wäre zu eng[cite: 9]."
  },
  {
    "frage": "Mara fährt ihre erkrankte Freundin zu einem Arzttermin. Welche Form sozialer Unterstützung liegt vor?",
    "a": "Emotionale Unterstützung",
    "b": "Informationelle Unterstützung",
    "c": "Instrumentelle Unterstützung",
    "d": "Wahrgenommene Unterstützung",
    "richtig": "c",
    "begruendung": "Instrumentelle Unterstützung meint konkrete praktische Hilfeleistungen. Trost wäre emotional, ein Ratschlag informationell[cite: 9]. AK-Falle: Nicht nach dem Zweck der Hilfe, sondern nach der Art der Handlung klassifizieren[cite: 9]."
  },
  {
    "frage": "Welche Zuordnung ist korrekt?",
    "a": "Wahrgenommene Unterstützung = behavioral und retrospektiv; erhaltene Unterstützung = kognitiv und prospektiv",
    "b": "Wahrgenommene Unterstützung = kognitiv und prospektiv; erhaltene Unterstützung = behavioral und retrospektiv",
    "c": "Beide Formen beziehen sich ausschließlich auf bereits erfolgte Hilfe.",
    "d": "Beide Formen hängen notwendigerweise stark miteinander zusammen.",
    "richtig": "b",
    "begruendung": "Wahrgenommene Unterstützung bezeichnet die zukünftige Erwartung verfügbarer Hilfe; erhaltene Unterstützung tatsächlich stattgefundene Hilfen. Beide können relativ unabhängig voneinander sein[cite: 9]. AK-Falle: perceived = denken/erwarten, received = tatsächlich passiert[cite: 9]."
  },
  {
    "frage": "Warum können Empfänger und Geber dieselbe Unterstützungsinteraktion unterschiedlich beurteilen?",
    "a": "Weil unterstützend gemeintes Verhalten nicht zwingend als Unterstützung wahrgenommen wird und umgekehrt.",
    "b": "Weil nur der Beobachter beurteilen kann, ob Unterstützung stattgefunden hat.",
    "c": "Weil die Perspektive des Gebers grundsätzlich objektiver ist.",
    "d": "Weil Unterstützung nur dann vorliegt, wenn Empfänger und Geber übereinstimmen.",
    "richtig": "a",
    "begruendung": "Die verschiedenen Perspektiven beruhen auf eigenen Interpretationen. Deshalb besteht zwischen Geber- und Empfängerurteil häufig nur eine begrenzte Übereinstimmung[cite: 9].\nAK-Falle: Intention des Gebers ≠ Wahrnehmung des Empfängers[cite: 9]."
  },
  {
    "frage": "Welche Aussage entspricht den Befunden zur sozialen Integration?",
    "a": "Alleinleben wirkt generell protektiv auf die Mortalität.",
    "b": "Nur die Qualität, nicht aber die Größe sozialer Netzwerke hängt mit Gesundheit zusammen.",
    "c": "Verheiratetsein erhöht generell das Mortalitätsrisiko.",
    "d": "Soziale Isolation und Alleinleben können Risikofaktoren sein, während ein großes Netzwerk und Verheiratetsein protektiv wirken können.",
    "richtig": "d",
    "begruendung": "Soziale Integration wurde sowohl mit psychischem Wohlbefinden als auch mit körperlicher Gesundheit und günstigeren Krankheitsverläufen verbunden. Mortalität (Sterblichkeit) ist bei sozialer Isolation bzw. Alleinleben ungünstiger[cite: 9]. AK-Falle: Schutz- und Risikorichtung nicht vertauschen[cite: 9]."
  },
  {
    "frage": "Welche Form sozialer Unterstützung zeigte besonders klare Zusammenhänge mit einem reduzierten Sterberisiko?",
    "a": "Ausschließlich instrumentelle Unterstützung",
    "b": "Tatsächlich erhaltene Unterstützung",
    "c": "Wahrgenommene Unterstützung",
    "d": "Ausschließlich informationelle Unterstützung",
    "richtig": "c",
    "begruendung": "Die Wahrnehmung, im Bedarfsfall über Unterstützung zu verfügen, hing prospektiv (vorausschauend) mit geringerem Sterberisiko zusammen. Für tatsächlich erhaltene Unterstützung zeigte sich dieser Effekt dort nicht eindeutig[cite: 9]. AK-Falle: Wahrgenommen ist gesundheitlich nicht die „schwächere“ Form, nur weil keine konkrete Handlung stattgefunden hat[cite: 9]."
  },
  {
    "frage": "Warum kann tatsächlich erhaltene Unterstützung teilweise mit geringerem Wohlbefinden zusammenhängen?",
    "a": "Hilfe kann als aufdringlich oder selbstwertbedrohend erlebt werden; außerdem erhalten besonders stark belastete Personen mehr Hilfe und haben bereits deshalb geringeres Wohlbefinden.",
    "b": "Tatsächlich erhaltene Unterstützung besteht grundsätzlich aus belastenden sozialen Kontakten.",
    "c": "Erhaltene Unterstützung senkt grundsätzlich die Selbstwirksamkeit.",
    "d": "Nur wahrgenommene Unterstützung kann überhaupt gesundheitliche Wirkungen haben.",
    "richtig": "a",
    "begruendung": "Neben möglichen negativen Wirkungen konkreter Hilfe wird ein Artefakt (scheinbarer Zusammenhang durch einen anderen Faktor) diskutiert: Hohe Belastung führt sowohl zu mehr Hilfebedarf als auch zu geringerem Wohlbefinden[cite: 9]. AK-Falle: Zusammenhang ≠ automatisch Ursache[cite: 9]."
  },
  {
    "frage": "Welche Zuordnung von Haupt- und Puffereffekt entspricht dem Studienbrief?",
    "a": "Integration = Puffereffekt; wahrgenommene Unterstützung = Puffereffekt; erhaltene Unterstützung = Haupteffekt",
    "b": "Alle drei zeigen ausschließlich Haupteffekte.",
    "c": "Integration = Haupteffekt; beide Unterstützungsformen = Puffereffekt",
    "d": "Integration und wahrgenommene Unterstützung = Haupteffekt; erhaltene Unterstützung = Puffereffekt",
    "richtig": "d",
    "begruendung": "Beim Haupteffekt besteht die günstige Wirkung unabhängig vom Stressniveau. Beim Puffereffekt wird insbesondere bei hoher Belastung die negative Stresswirkung abgeschwächt[cite: 9]. AK-Falle: Integration + perceived = Haupt; received = Puffer[cite: 9]."
  },
  {
    "frage": "Was gehört zum verhaltensbezogenen Wirkweg sozialer Faktoren nach Uchino?",
    "a": "Ausschließlich günstigere emotionale Zustände",
    "b": "Günstigeres Gesundheitsverhalten und bessere Adhärenz an ärztliche Anweisungen",
    "c": "Ausschließlich geringere Cortisolproduktion",
    "d": "Ausschließlich eine höhere Beziehungszufriedenheit",
    "richtig": "b",
    "begruendung": "Adhärenz (Befolgung medizinischer Empfehlungen) und Gesundheitsverhalten bilden den verhaltensbezogenen Weg. Motivation und Information durch andere können diesen fördern[cite: 9]. AK-Falle: Biologische Prozesse sind nicht selbst der verhaltensbezogene Wirkweg[cite: 9]."
  },
  {
    "frage": "Welche Aussage zum zweiten Wirkweg nach Uchino ist korrekt?",
    "a": "Er umfasst ausschließlich beobachtbares Gesundheitsverhalten.",
    "b": "Er betrifft nur die Größe des sozialen Netzwerks.",
    "c": "Er verläuft über Bewertungen, Emotionen und Kontrollüberzeugungen und kann anschließend biologische Prozesse beeinflussen.",
    "d": "Er wirkt unabhängig von kardiovaskulären, immunologischen und neuroendokrinen Prozessen.",
    "richtig": "c",
    "begruendung": "Der psychologische Weg umfasst u. a. Stressbewertungen und Kontrollüberzeugungen (Überzeugung, eine Situation bewältigen zu können). Beide Wirkwege können anschließend kardiovaskuläre (Herz-Kreislauf), immunologische und neuroendokrine (Nerven- und Hormonsystem betreffende) Prozesse beeinflussen[cite: 9]. AK-Falle: Nicht psychologisch oder biologisch – psychologische Prozesse können biologische Prozesse anstoßen[cite: 9]."
  },
  {
    "frage": "Welche Aussage beschreibt das VSA-Modell (Vulnerability-Stress-Adaptation-Modell; Modell zur Beziehungsqualität und -stabilität) korrekt?",
    "a": "Adaptive Prozesse entstehen erst als Folge der Beziehungsstabilität.",
    "b": "Stabile Charakteristika beeinflussen adaptive Prozesse; diese stehen mit der Beziehungszufriedenheit in Wechselwirkung, die wiederum die Beziehungsstabilität beeinflusst.",
    "c": "Stresshafte Umstände spielen für das Modell keine Rolle.",
    "d": "Persönlichkeit und Konfliktlöseverhalten gehören beide zu den stabilen Charakteristika.",
    "richtig": "b",
    "begruendung": "Adaptive Prozesse (Anpassungs- und Bewältigungsverhalten, z. B. Konfliktlösung) vermitteln wesentlich zwischen stabilen Merkmalen und der Beziehungsqualität; Stress wirkt ebenfalls ein[cite: 9]. AK-Falle: Konfliktlösung = adaptiver Prozess, nicht stabiles Persönlichkeitsmerkmal[cite: 9]."
  },
  {
    "frage": "Welche Aussage zu Neurotizismus (Tendenz zu emotionaler Instabilität und negativen Gefühlen) entspricht dem Studienbrief?",
    "a": "Bei Singles hängt höherer Neurotizismus mit einer höheren Wahrscheinlichkeit zusammen, eine Beziehung einzugehen; in bestehenden Beziehungen dagegen mit geringerer Zufriedenheit und Stabilität.",
    "b": "Hoher Neurotizismus reduziert sowohl bei Singles als auch in Partnerschaften die Wahrscheinlichkeit einer Beziehung.",
    "c": "Neurotizismus beeinflusst nur die eigene, niemals die partnerschaftliche Zufriedenheit.",
    "d": "Neurotizismus steht ausschließlich mit Beziehungsstabilität, nicht mit Beziehungszufriedenheit in Zusammenhang.",
    "richtig": "a",
    "begruendung": "Gerade diese unterschiedliche Richtung je nach Beziehungssituation ist wichtig: Singles gehen bei höherem Neurotizismus eher eine Beziehung ein, bestehende Beziehungen fallen jedoch ungünstiger aus[cite: 9]. AK-Falle: Gegenintuitiven Befund nicht „weglogisieren“[cite: 9]."

    let currentQuestionIndex = 0;
    let score = 0; 
    let totalPossiblePoints = 0; 
    let userAnswers = {};

    function startQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        totalPossiblePoints = 0;
        userAnswers = {};

        questions.forEach((q, index) => {
            const correctArr = q.richtig.split(',').map(s => s.trim().toLowerCase());
            totalPossiblePoints += correctArr.length;
        });

        document.getElementById('startScreen').classList.remove('active');
        document.getElementById('quizScreen').classList.add('active');
        loadQuestion();
    }

    function loadQuestion() {
        resetState();
        const q = questions[currentQuestionIndex];
        
        document.getElementById('questionCounter').innerText = `Frage ${currentQuestionIndex + 1} / ${questions.length}`;
        document.getElementById('questionText').innerText = q.frage;

        const optionsList = document.getElementById('optionsList');
        const optionsKeys = ['a', 'b', 'c', 'd', 'e'];

        optionsKeys.forEach(key => {
            if (q[key]) {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `${key.toUpperCase()}) ${q[key]}`;
                btn.dataset.key = key;
                btn.onclick = () => toggleOption(btn);
                optionsList.appendChild(btn);
            }
        });

        updateProgress();
    }

    function toggleOption(btn) {
        if (btn.disabled) return;
        btn.classList.toggle('selected');
    }

    function resetState() {
        const optionsList = document.getElementById('optionsList');
        optionsList.innerHTML = '';
        const explanationBox = document.getElementById('explanationBox');
        explanationBox.classList.remove('show');
        explanationBox.innerText = '';
        const actionBtn = document.getElementById('actionBtn');
        actionBtn.innerText = 'Antworten prüfen';
        actionBtn.onclick = handleAction;
    }

    function handleAction() {
        const actionBtn = document.getElementById('actionBtn');
        const q = questions[currentQuestionIndex];
        const selectedButtons = document.querySelectorAll('.option-btn.selected');
        
        if (selectedButtons.length === 0) {
            alert('Bitte wähle mindestens eine Option aus.');
            return;
        }

        const correctArr = q.richtig.split(',').map(s => s.trim().toLowerCase());
        const optionButtons = document.querySelectorAll('.option-btn');

        optionButtons.forEach(btn => {
            btn.disabled = true;
            const key = btn.dataset.key;
            const isSelected = btn.classList.contains('selected');
            const isCorrect = correctArr.includes(key);

            if (isCorrect) {
                btn.classList.add('correct-ans');
                if (isSelected) {
                    score += 1;
                }
            } else {
                if (isSelected) {
                    btn.classList.add('wrong-ans');
                }
            }
        });

        const explanationBox = document.getElementById('explanationBox');
        explanationBox.innerText = "Begründung: " + q.begruendung;
        explanationBox.classList.add('show');

        actionBtn.innerText = 'Nächste Frage';
        actionBtn.onclick = nextQuestion;
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function updateProgress() {
        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        document.getElementById('progressFill').style.width = `${progressPercent}%`;
    }

    function showResults() {
        document.getElementById('quizScreen').classList.remove('active');
        document.getElementById('resultScreen').classList.add('active');
        document.getElementById('progressFill').style.width = '100%';

        const percentage = totalPossiblePoints > 0 ? Math.round((score / totalPossiblePoints) * 100) : 0;

        document.getElementById('resultScore').innerText = `${percentage}%`;

        const statusEl = document.getElementById('resultStatus');
        const detailsEl = document.getElementById('resultDetails');

        if (percentage >= 75) {
            statusEl.innerText = "Bestanden!";
            statusEl.className = "result-status passed";
        } else {
            statusEl.innerText = "Nicht bestanden";
            statusEl.className = "result-status failed";
        }

        detailsEl.innerText = `Du hast ${score} von ${totalPossiblePoints} möglichen Antwort-Punkten richtig erreicht.`;
    }

    function restartQuiz() {
        document.getElementById('resultScreen').classList.remove('active');
        document.getElementById('startScreen').classList.add('active');
    }
</script>
