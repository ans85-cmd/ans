    <style>
        :root {
            --bg-color: #f1f5f9;
            --panel-bg: #ffffff;
            
            --primary-blue: #1e3a8a;       
            --primary-blue-hover: #1e40af;
            --accent-gold: #b45309;        
            
            --border-color: #cbd5e1;
            --text-dark: #0f172a;          
            --text-muted: #64748b;
            
            --correct-bg: #ecfdf5;
            --correct-border: #10b981;
            --correct-text: #065f46;
            
            --wrong-bg: #fef2f2;
            --wrong-border: #ef4444;
            --wrong-text: #991b1b;
            
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-card: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);

        * {

            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);

            align-items: center;
            padding: 20px;

            background-attachment: fixed;

        /* Fixer Zurück-Button */
        .fixed-back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--primary-blue);
            padding: 8px 14px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
            z-index: 1000;
        }

        .fixed-back-btn:hover {
            background: #eff6ff;
            border-color: var(--primary-blue);
            transform: translateY(-1px);
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
            border-radius: var(--radius-lg);
            padding: 32px 28px;

        }

        header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 18px;
            position: relative;
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.4rem;
            color: var(--primary-blue);
            letter-spacing: 1.5px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            margin-top: 16px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-blue);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .question-meta {
            font-size: 0.75rem;
            color: var(--accent-gold);
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 1.05rem;
            margin-bottom: 22px;
            line-height: 1.6;
            color: var(--text-dark);
            font-weight: 600;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-btn {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            color: var(--text-dark);
            padding: 14px 18px;
            border-radius: var(--radius-md);
            text-align: left;
            font-size: 0.92rem;
            line-height: 1.5;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-blue);
            background: #f1f5f9;
            transform: translateY(-1px);
        }

        .option-btn.selected {
            background: #eff6ff;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 1px var(--primary-blue);
            color: var(--primary-blue);
            font-weight: 500;
        }

        .option-btn.correct-ans {
            background: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            font-weight: 600;
        }

        .option-btn.wrong-ans {
            background: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .cyber-btn {
            width: 100%;
            background: var(--primary-blue);
            border: none;
            color: #ffffff;
            padding: 15px;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.2);
            transition: all 0.2s ease;
        }

        .cyber-btn:hover {
            background: var(--primary-blue-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 10px -1px rgba(30, 58, 138, 0.3);
        }

        .cyber-btn:active {
            transform: translateY(0);
        }

        .explanation {
            font-size: 0.88rem;
            background: #f8fafc;
            border-left: 4px solid var(--primary-blue);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            padding: 14px 16px;
            margin-bottom: 20px;
            color: #334155;
            line-height: 1.5;
            display: none;
        }
        
        .explanation.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-box {
            text-align: center;
            padding: 10px 0;
        }

        .result-score {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 3.5rem;
            margin: 10px 0;
            color: var(--primary-blue);
            font-weight: 800;
        }

        .result-status {
            font-size: 1.15rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .passed {
            color: #059669;
        }

        .failed {
            color: #dc2626;
        }
    </style>
</head>

<script>
    const questions = [
  {
    "frage": "Frage 1: Warum ist die Kindheit aus gesundheitspsychologischer Sicht besonders relevant?",
    "a": "Weil gesundheitliche Folgen ungünstigen Verhaltens grundsätzlich bereits in der Kindheit auftreten.",
    "b": "Weil gesundheitsbezogenes Verhalten erst mit dem Eintritt in die Schule erlernt wird.",
    "c": "Weil gesundheitliche Gewohnheiten in der Kindheit noch keine Stabilität aufweisen.",
    "d": "Weil gesundheitsbezogenes Verhalten früh erlernt und verfestigt wird und etablierte Gewohnheiten relativ schwer veränderbar sind.",
    "richtig": "d",
    "begruendung": "Bewegung, Essverhalten und Zahnhygiene werden bereits in der Kindheit erlernt und bleiben über spätere Lebensabschnitte relativ stabil. A ist ein guter Distraktor, weil gesundheitliche Folgen ungünstiger Gewohnheiten teilweise erst später sichtbar werden. AK-Falle: „Kindheit gilt als gesunder Lebensabschnitt“ nicht mit „gesundheitspsychologisch unwichtig“ gleichsetzen.[cite: 8]"
  },
  {
    "frage": "Frage 2: Was kennzeichnet Entwicklungsaufgaben nach dem im Studienbrief dargestellten Ansatz?",
    "a": "Sie sind unerwartete Ereignisse, mit denen nur einzelne Personen einer Altersgruppe konfrontiert werden.",
    "b": "Sie entstehen aus dem Zusammenspiel kultureller Erwartungen, körperlicher Entwicklung und Persönlichkeitsentwicklung.",
    "c": "Sie ergeben sich ausschließlich aus biologischen Reifungsprozessen.",
    "d": "Sie treten ausschließlich dann auf, wenn die altersgerechte Entwicklung beeinträchtigt ist.",
    "richtig": "b",
    "begruendung": "Entwicklungsaufgaben sind altersbezogene Anforderungen, mit denen Personen einer bestimmten Lebensphase konfrontiert werden. A beschreibt eher kritische Lebensereignisse. AK-Falle: Entwicklungsaufgabe ≠ kritisches Lebensereignis.[cite: 8]"
  },
  {
    "frage": "Frage 3: Welche Aussage beschreibt den Zusammenhang zwischen Erkrankung und Entwicklungsaufgaben korrekt?",
    "a": "Eine Erkrankung stellt eine zusätzliche Belastung dar und kann die Bewältigung altersbezogener Entwicklungsaufgaben erschweren.",
    "b": "Nur chronische Erkrankungen können Entwicklungsprozesse beeinflussen; akute Erkrankungen spielen keine Rolle.",
    "c": "Erkrankungen wirken sich ausschließlich auf die körperliche Entwicklung aus.",
    "d": "Durch stärkere elterliche Fürsorge werden Entwicklungsaufgaben bei erkrankten Kindern grundsätzlich leichter bewältigt.",
    "richtig": "a",
    "begruendung": "Der Studienbrief nennt körperliche Einschränkungen, Arztbesuche, Fehltage und überprotektives Elternverhalten als mögliche Belastungen. B ist falsch, weil auch häufige akute Erkrankungen bei Kindern unter vier Jahren mit eingeschränkten Alltagsfähigkeiten in Verbindung gebracht werden. AK-Falle: Krankheit nicht auf körperliche Folgen reduzieren.[cite: 8]"
  },
  {
    "frage": "Frage 4: Welche Beschreibung gehört zur präoperationalen Phase des kindlichen Krankheitsverständnisses?",
    "a": "Verständnis von Ansteckung und Internalisierung sowie sichtbaren und unsichtbaren Symptomen",
    "b": "Einbezug mehrerer psychologischer und physiologischer Krankheitsfaktoren",
    "c": "Zirkuläre oder magische Krankheitserklärungen und Konzentration auf sichtbare Merkmale",
    "d": "Verbindung äußerer Krankheitsursachen mit inneren körperlichen Wirkungen",
    "richtig": "c",
    "begruendung": "In der präoperationalen Phase können Ursache und Wirkung noch nicht zuverlässig unterschieden werden; Erklärungen sind beispielsweise magisch oder zirkulär (Ursache und Folge werden nicht sauber getrennt). A und D gehören zur konkret-operationalen Phase. AK-Falle: präoperational = magisch/zirkulär/sichtbar.[cite: 8]"
  },
  {
    "frage": "Frage 5: Was kennzeichnet die konkret-operationale Phase des Krankheitsverständnisses?",
    "a": "Krankheiten werden vorwiegend durch höhere Mächte erklärt.",
    "b": "Kinder verstehen Ansteckung und Internalisierung und können sichtbare sowie unsichtbare Symptome beschreiben.",
    "c": "Verschiedene physiologische und psychologische Faktoren werden bereits umfassend integriert.",
    "d": "Krankheiten können ausschließlich anhand unmittelbar sichtbarer Merkmale beschrieben werden.",
    "richtig": "b",
    "begruendung": "Internalisierung (Eindringen eines schädigenden Einflusses in den Körper) und Ansteckung gehören ausdrücklich zur konkret-operationalen Phase. C ist der stärkste Distraktor, weil die umfassende Integration mehrerer psychologischer und physiologischer Faktoren erst zur formal-operationalen Phase gehört. AK-Falle: konkret-operational und formal-operational nicht vertauschen.[cite: 8]"
  },
  {
    "frage": "Frage 6: Welcher Kritikpunkt wird am strukturgenetischen Ansatz nach Piaget genannt?",
    "a": "Er nimmt überhaupt keine altersbezogenen Veränderungen des Krankheitsverständnisses an.",
    "b": "Er erklärt Krankheitskonzepte ausschließlich durch persönliche Krankheitserfahrungen.",
    "c": "Er geht davon aus, dass jede Krankheit zu einem anderen kognitiven Entwicklungsstadium gehört.",
    "d": "Er könnte jüngere Kinder unterschätzen und die Entwicklung zu stark in starre Altersstufen einteilen.",
    "richtig": "d",
    "begruendung": "Jüngere Kinder können möglicherweise bereits mehr intuitiv verstehen, als sie sprachlich ausdrücken können. Außerdem entwickeln sich krankheitsspezifische Konzepte nicht zwingend zu exakt denselben Zeitpunkten. AK-Falle: fehlende sprachliche Erklärung ≠ fehlendes Verständnis.[cite: 8]"
  },
  {
    "frage": "Frage 7: Welche Aussage beschreibt den wissens- bzw. schemabasierten Ansatz korrekt?",
    "a": "Krankheitsverständnis hängt wesentlich von vorhandenem Wissen und persönlichen Erfahrungen ab, die in Wissensstrukturen organisiert werden.",

    "c": "Jüngere Kinder sind aufgrund ihrer kognitiven Entwicklung grundsätzlich nicht in der Lage, komplexere Krankheitsinformationen zu verstehen.",
    "d": "Krankheitsspezifisches Vorwissen erschwert die Aufnahme neuer Informationen.",
    "richtig": "a",
    "begruendung": "Schemata (organisierte Wissensstrukturen) werden durch neue Informationen und Erfahrungen erweitert. C entspricht eher einer zu starren Interpretation des strukturgenetischen Ansatzes. AK-Falle: Piaget = stärker Entwicklungsstufen; Schema-Ansatz = stärker Wissen und Erfahrung.[cite: 8]"
  },
  {
    "frage": "Frage 8: Wie verändert sich das Verständnis von Gesundheit mit zunehmendem Alter?",
    "a": "Gesundheit wird zunehmend ausschließlich als Abwesenheit von Krankheit definiert.",
    "b": "Funktionalität im täglichen Leben verliert bei Jugendlichen an Bedeutung.",
    "c": "Das Gesundheitsverständnis wird detaillierter und schließt zunehmend Aspekte wie Energie, persönliche Bedeutung und alltägliches Funktionieren ein.",

    "richtig": "c",
    "begruendung": "Schon Kinder definieren Gesundheit nicht ausschließlich über Krankheitsfreiheit; das Konzept wird mit zunehmendem Alter differenzierter. D ist vertauscht: Gerade jüngere Kinder betrachten Gesundheit und Krankheit häufiger dichotom (als einander ausschließende Kategorien). AK-Falle: jünger = eher entweder/oder; älter = differenzierter.[cite: 8]"
  },
  {
    "frage": "Frage 9: Welches Beispiel gehört bei Bronfenbrenner zum Exosystem?",
    "a": "Ein Kind spricht direkt mit seiner Lehrerin.",
    "b": "Eltern und Lehrkräfte stimmen sich über das Nahrungsangebot der Schule ab.",
    "c": "Gesellschaftliche Gesetze regeln Tabakwerbung.",
    "d": "Arbeitsbedingter Stress der Eltern wirkt sich auf das Familienleben und dadurch indirekt auf das Kind aus.",
    "richtig": "d",
    "begruendung": "Das Exosystem (Umweltbereich, dem das Kind nicht unmittelbar angehört, der es aber indirekt beeinflusst) umfasst beispielsweise den Arbeitsplatz der Eltern. B gehört zum Mesosystem, C zum Makrosystem. AK-Falle: Exo = indirekt; Meso = Verbindung zwischen Mikrosystemen.[cite: 8]"
  },
  {
    "frage": "Frage 10: Welche Aussage beschreibt die Rolle der Eltern für das Gesundheitsverhalten ihrer Kinder am besten?",
    "a": "Eltern beeinflussen es durch Entscheidungen, Unterstützung, Routinen, Nahrungsmittelangebote und eigenes Vorbildverhalten.",
    "b": "Eltern beeinflussen Gesundheitsverhalten hauptsächlich durch medizinische Entscheidungen, nicht durch alltägliche Routinen.",
    "c": "Vorbildverhalten der Eltern ist nur für Ernährung, nicht aber für Bewegung oder Medienkonsum bedeutsam.",
    "d": "Im frühen Kindesalter entstehen Gesundheitsroutinen weitgehend unabhängig von den Eltern.",
    "richtig": "a",
    "begruendung": "Der Studienbrief nennt unter anderem Impfentscheidungen, Unterstützung sportlicher Aktivitäten, Zahnhygiene, Nahrungsmittelpräferenzen und Modellverhalten. B ist zu eng, weil der Einfluss weit über medizinische Entscheidungen hinausgeht. AK-Falle: Elterlicher Einfluss ≠ nur Regeln und Verbote.[cite: 8]"
  },
  {
    "frage": "Frage 11: Welcher Erziehungsstil wird im Studienbrief als besonders gesundheitsförderlich beschrieben?",
    "a": "autoritärer Erziehungsstil mit besonders hoher Kontrolle",
    "b": "permissiver Erziehungsstil mit wenig Kontrolle",

    "richtig": "c",
    "begruendung": "Autoritativ (Wärme und Unterstützung verbunden mit angemessener Kontrolle) zeigte günstige Zusammenhänge mit Ess-, Schlaf- und Bewegungsverhalten. A ist wegen der ähnlichen Bezeichnung ein besonders guter Distraktor: autoritär bedeutet hier übermäßige Kontrolle. AK-Falle: autoritativ ≠ autoritär.[cite: 8]"
  },
  {
    "frage": "Frage 12: Wie sind die meisten Programme zur Gesundheitsförderung und Prävention bei Kindern in Deutschland ausgerichtet?",
    "a": "überwiegend auf bereits betroffene Kinder",
    "b": "universell, also ohne Eingrenzung auf eine spezielle Risikogruppe",

  },
  {
    "frage": "Frage 13: Welche Aussage entspricht den Ergebnissen der im Studienbrief beschriebenen Meta-Analyse am besten?",
    "a": "Programme zeigen besonders gute Effekte auf Wissen und sozialkognitive Faktoren; spezifischere Programme erzielen beim tatsächlichen Verhalten häufig bessere Effekte als allgemeine Lebenskompetenzprogramme.",
    "b": "Allgemeine Lebenskompetenzprogramme zeigen die größten Effekte auf jedes konkrete Gesundheitsverhalten.",

    let currentQuestionIndex = 0;
    let score = 0; 
    let totalPossiblePoints = 0; 
    let userAnswers = {};

    function startQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        totalPossiblePoints = 0;
        userAnswers = {};

        questions.forEach((q, index) => {
            const correctArr = q.richtig.split(',').map(s => s.trim().toLowerCase());
            totalPossiblePoints += correctArr.length;
        });

        document.getElementById('startScreen').classList.remove('active');
        document.getElementById('quizScreen').classList.add('active');
        loadQuestion();
    }

    function loadQuestion() {
        resetState();
        const q = questions[currentQuestionIndex];
        
        document.getElementById('questionCounter').innerText = `Frage ${currentQuestionIndex + 1} / ${questions.length}`;
        document.getElementById('questionText').innerText = q.frage;

        const optionsList = document.getElementById('optionsList');
        const optionsKeys = ['a', 'b', 'c', 'd', 'e'];

        optionsKeys.forEach(key => {
            if (q[key]) {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `${key.toUpperCase()}) ${q[key]}`;
                btn.dataset.key = key;
                btn.onclick = () => toggleOption(btn);
                optionsList.appendChild(btn);
            }
        });

        updateProgress();
    }

    function toggleOption(btn) {
        if (btn.disabled) return;
        btn.classList.toggle('selected');
    }

    function resetState() {
        const optionsList = document.getElementById('optionsList');
        optionsList.innerHTML = '';
        const explanationBox = document.getElementById('explanationBox');
        explanationBox.classList.remove('show');
        explanationBox.innerText = '';
        const actionBtn = document.getElementById('actionBtn');
        actionBtn.innerText = 'Antworten prüfen';
        actionBtn.onclick = handleAction;
    }

    function handleAction() {
        const actionBtn = document.getElementById('actionBtn');
        const q = questions[currentQuestionIndex];
        const selectedButtons = document.querySelectorAll('.option-btn.selected');
        
        if (selectedButtons.length === 0) {
            alert('Bitte wähle mindestens eine Option aus.');
            return;
        }

        const correctArr = q.richtig.split(',').map(s => s.trim().toLowerCase());
        const optionButtons = document.querySelectorAll('.option-btn');

        optionButtons.forEach(btn => {
            btn.disabled = true;
            const key = btn.dataset.key;
            const isSelected = btn.classList.contains('selected');
            const isCorrect = correctArr.includes(key);

            if (isCorrect) {
                btn.classList.add('correct-ans');
                if (isSelected) {
                    score += 1;
                }
            } else {
                if (isSelected) {
                    btn.classList.add('wrong-ans');
                }
            }
        });

        const explanationBox = document.getElementById('explanationBox');
        explanationBox.innerText = "Begründung: " + q.begruendung;
        explanationBox.classList.add('show');

        actionBtn.innerText = 'Nächste Frage';
        actionBtn.onclick = nextQuestion;
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function updateProgress() {
        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        document.getElementById('progressFill').style.width = `${progressPercent}%`;
    }

    function showResults() {
        document.getElementById('quizScreen').classList.remove('active');
        document.getElementById('resultScreen').classList.add('active');
        document.getElementById('progressFill').style.width = '100%';

        const percentage = totalPossiblePoints > 0 ? Math.round((score / totalPossiblePoints) * 100) : 0;

        document.getElementById('resultScore').innerText = `${percentage}%`;

        const statusEl = document.getElementById('resultStatus');
        const detailsEl = document.getElementById('resultDetails');

        if (percentage >= 75) {
            statusEl.innerText = "Bestanden!";
            statusEl.className = "result-status passed";
        } else {
            statusEl.innerText = "Nicht bestanden";
            statusEl.className = "result-status failed";
        }

        detailsEl.innerText = `Du hast ${score} von ${totalPossiblePoints} möglichen Antwort-Punkten richtig erreicht.`;
    }

    function restartQuiz() {
        document.getElementById('resultScreen').classList.remove('active');
        document.getElementById('startScreen').classList.add('active');
    }
</script>
