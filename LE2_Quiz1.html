<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J]L[M</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f1f5f9;
            --panel-bg: #ffffff;
            
            --primary-blue: #1e3a8a;       
            --primary-blue-hover: #1e40af;
            --accent-gold: #b45309;        
            
            --border-color: #cbd5e1;
            --text-dark: #0f172a;          
            --text-muted: #64748b;
            
            --correct-bg: #ecfdf5;
            --correct-border: #10b981;
            --correct-text: #065f46;
            
            --wrong-bg: #fef2f2;
            --wrong-border: #ef4444;
            --wrong-text: #991b1b;
            
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-card: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(180, 83, 9, 0.04) 0px, transparent 50%);
            background-attachment: fixed;
        }

        /* Fixer Zurück-Button */
        .fixed-back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--primary-blue);
            padding: 8px 14px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
            z-index: 1000;
        }

        .fixed-back-btn:hover {
            background: #eff6ff;
            border-color: var(--primary-blue);
            transform: translateY(-1px);
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
            border-radius: var(--radius-lg);
            padding: 32px 28px;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 18px;
            position: relative;
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.4rem;
            color: var(--primary-blue);
            letter-spacing: 1.5px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            margin-top: 16px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-blue);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .question-meta {
            font-size: 0.75rem;
            color: var(--accent-gold);
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 1.05rem;
            margin-bottom: 22px;
            line-height: 1.6;
            color: var(--text-dark);
            font-weight: 600;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-btn {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            color: var(--text-dark);
            padding: 14px 18px;
            border-radius: var(--radius-md);
            text-align: left;
            font-size: 0.92rem;
            line-height: 1.5;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-blue);
            background: #f1f5f9;
            transform: translateY(-1px);
        }

        .option-btn.selected {
            background: #eff6ff;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 1px var(--primary-blue);
            color: var(--primary-blue);
            font-weight: 500;
        }

        .option-btn.correct-ans {
            background: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            font-weight: 600;
        }

        .option-btn.wrong-ans {
            background: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .cyber-btn {
            width: 100%;
            background: var(--primary-blue);
            border: none;
            color: #ffffff;
            padding: 15px;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.2);
            transition: all 0.2s ease;
        }

        .cyber-btn:hover {
            background: var(--primary-blue-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 10px -1px rgba(30, 58, 138, 0.3);
        }

        .cyber-btn:active {
            transform: translateY(0);
        }

        .explanation {
            font-size: 0.88rem;
            background: #f8fafc;
            border-left: 4px solid var(--primary-blue);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            padding: 14px 16px;
            margin-bottom: 20px;
            color: #334155;
            line-height: 1.5;
            display: none;
        }
        
        .explanation.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-box {
            text-align: center;
            padding: 10px 0;
        }

        .result-score {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 3.5rem;
            margin: 10px 0;
            color: var(--primary-blue);
            font-weight: 800;
        }

        .result-status {
            font-size: 1.15rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .passed {
            color: #059669;
        }

        .failed {
            color: #dc2626;
        }
    </style>
</head>

<div class="app-container">

                <path d="M 55 -25 C 35 -30, 10 -20, 0 -10 L 0 35 C 10 25, 35 15, 55 20 Z" fill="#f8fafc" opacity="0.9"/>

    <div id="startScreen" class="screen active">
        <div class="question-text" style="text-align: center; margin-top: 10px;">
            Bereit für deine Lernsession?<br><span style="color: var(--primary-blue); font-weight: 700;">Lerneinheit 2</span>
        </div>
        <p style="font-size: 0.88rem; text-align: center; margin-bottom: 28px; color: var(--text-muted); line-height: 1.5;">

        </p>

    <div id="quizScreen" class="screen">

<script>
    const questions = [
   {
    "frage": "1. Welche Aussage beschreibt gesundheitsbezogenes Verhalten am umfassendsten?",
    "a": "Es umfasst ausschließlich Verhalten, das nachweislich die Gesundheit verbessert.",
    "b": "Es umfasst gesundheitsförderliches und gesundheitsschädigendes sowie je nach Kontext unterschiedlich gesundheitsrelevantes Verhalten.",
    "c": "Es bezeichnet ausschließlich bewusst ausgeführtes Präventionsverhalten.",
    "d": "Es bezeichnet ausschließlich Verhalten gesunder Personen.",
    "richtig": "b",
    "begruendung": "Gesundheitsbezogenes Verhalten ist der Oberbegriff. Dazu gehören auch Risikoverhalten, Früherkennungsverhalten und Verhalten, das nur bei bestimmten Erkrankungen oder Personengruppen relevant wird."
  },
  {
    "frage": "2. Welche Aussage zum Verhältnis von gesundheitsbezogenem und gesundheitsförderlichem Verhalten ist korrekt?",
    "a": "Beide Begriffe sind synonym.",
    "b": "Gesundheitsbezogenes Verhalten ist eine Unterform gesundheitsförderlichen Verhaltens.",
    "c": "Gesundheitsschädigendes Verhalten zählt nicht zur Gesundheitspsychologie.",
    "d": "Gesundheitsförderliches Verhalten ist nur eine mögliche Form gesundheitsbezogenen Verhaltens.",
    "richtig": "d",
    "begruendung": "Auch Rauchen oder riskantes Autofahren sind gesundheitsbezogene Verhaltensweisen, obwohl sie nicht gesundheitsförderlich sind."
  },
  {
    "frage": "3. Warum kann die Kategorie „Bewegung“ nicht grundsätzlich als gesundheitsförderlich eingeordnet werden?",
    "a": "Weil Bewegung nur bei erkrankten Menschen gesundheitsrelevant ist.",
    "b": "Weil Bewegung keine messbaren gesundheitlichen Folgen besitzt.",
    "c": "Weil nur die Absicht der Person entscheidet.",
    "d": "Weil unterschiedliche Formen von Bewegung förderliche oder schädigende Folgen haben können.",
    "richtig": "d",
    "begruendung": "Moderate regelmäßige Bewegung kann fördern, Extremsport dagegen Risiken bergen. Entscheidend ist die konkrete Ausgestaltung."
  },
  {
    "frage": "4. Welche Aussage verdeutlicht die ökologisch-systemische Sichtweise auf Gesundheitsverhalten?",
    "a": "Verhalten wird im Wesentlichen durch Gene bestimmt.",
    "b": "Verhalten entsteht ausschließlich aus bewussten Entscheidungen.",
    "c": "Interne Merkmale und externe soziale, materielle und kulturelle Bedingungen wirken zusammen.",
    "d": "Äußere Bedingungen werden erst relevant, wenn eine Krankheit vorliegt.",
    "richtig": "c",
    "begruendung": "Gesundheitsverhalten entsteht aus dem Zusammenspiel von Person und Umwelt."
  },
  {
    "frage": "5. Was zeigt das historische Beispiel der Zigarettenwerbung besonders gut?",
    "a": "Medizinisches Fachpersonal bestimmt gesellschaftliche Normen vollständig.",
    "b": "Gesundheitsschädliches Verhalten war früher grundsätzlich unbekannt.",
    "c": "Wissenschaftliche Erkenntnisse und Interessen gesellschaftlicher Akteur:innen können gemeinsam beeinflussen, wie ein Verhalten bewertet wird.",
    "d": "Gesundheitsbezogenes Verhalten ist kulturell unveränderlich.",
    "richtig": "c",
    "begruendung": "Gesellschaftliche Normen über „gesund“ und „ungesund“ verändern sich. Unternehmen, Politik, Medien und Wissenschaft können daran beteiligt sein."
  },
  {
    "frage": "6. Welche der folgenden Verhaltensweisen gehört nicht zu den von Belloc und Breslow beschriebenen „Alameda Seven“?",
    "a": "regelmäßiges Frühstück",
    "b": "Nichtrauchen",
    "c": "regelmäßige körperliche Betätigung",
    "d": "ausreichende Flüssigkeitszufuhr",
    "richtig": "d",
    "begruendung": "Die sieben waren genügend Schlaf, Nichtrauchen, geringer Alkoholkonsum, Bewegung, regelmäßiges Frühstück, keine Zwischenmahlzeiten und Normalgewicht."
  },
  {
    "frage": "7. Was bedeutet es, dass die Effekte der „Alameda Seven“ additiv waren?",
    "a": "Je mehr der günstigen Verhaltensweisen gemeinsam praktiziert wurden, desto günstiger war der Gesundheitswert.",
    "b": "Nur alle sieben zusammen hatten einen Zusammenhang mit Gesundheit.",
    "c": "Jede zusätzliche Verhaltensweise verringerte den Effekt der anderen.",
    "d": "Alle sieben Verhaltensweisen hatten exakt denselben Effekt.",
    "richtig": "a",
    "begruendung": "Additiv bedeutet, dass sich Effekte summieren können. Personen mit allen sieben Verhaltensweisen hatten deutlich günstigere Gesundheitswerte."
  },
  {
    "frage": "8. Welche Aussage entspricht den epidemiologischen Befunden im Studienbrief?",
    "a": "Gesundheit ist weitgehend genetisch festgelegt.",
    "b": "Verhalten beeinflusst ausschließlich die Lebensqualität, nicht Erkrankungsrisiken.",
    "c": "Verhalten wie Rauchen, Bewegung und Ernährung hängt deutlich mit Morbidität und Mortalität zusammen.",
    "d": "Risikoverhalten beeinflusst ausschließlich akute Krankheiten.",
    "richtig": "c",
    "begruendung": "Morbidität = Krankheitshäufigkeit; Mortalität = Sterblichkeit. Zahlreiche epidemiologische Studien zeigen Zusammenhänge mit Gesundheitsverhalten."
  },
  {
    "frage": "9. Was bezeichnet „Gesundheitsverhalten“ nach Kasl und Cobb?",
    "a": "Verhalten einer manifest erkrankten Person im Rahmen der Therapie",
    "b": "Verhalten gesunder bzw. sich gesund fühlender Personen zur Krankheitsvermeidung oder Früherkennung",
    "c": "jede Reaktion auf subjektive Krankheitssymptome",
    "d": "ausschließlich gesundheitsförderndes Verhalten unabhängig vom Gesundheitszustand",
    "richtig": "b",
    "begruendung": "Entscheidend ist hier der Status der Person: gesund bzw. sich gesund fühlend."
  },
  {
    "frage": "10. Eine Person fühlt sich seit Tagen krank und vereinbart deshalb einen Arzttermin, ohne zu wissen, ob tatsächlich eine Krankheit vorliegt. Wie wird dieses Verhalten nach Kasl und Cobb bezeichnet?",
    "a": "Gesundheitsverhalten",
    "b": "Krankenrollenverhalten",
    "c": "präventives Verhalten",
    "d": "Krankheitsverhalten",
    "richtig": "d",
    "begruendung": "Krankheitsverhalten setzt subjektives Krankheitsgefühl voraus, aber nicht zwingend eine bestätigte Diagnose."
  },
  {
    "frage": "11. Eine Person mit diagnostiziertem Diabetes nimmt ihre verordneten Medikamente regelmäßig ein. Welche Kategorie nach Kasl und Cobb passt am besten?",
    "a": "Gesundheitsverhalten",
    "b": "Krankheitsverhalten",
    "c": "aufdeckendes Verhalten",
    "d": "Krankenrollenverhalten",
    "richtig": "d",
    "begruendung": "Krankenrollenverhalten wird bei manifester, also festgestellter Erkrankung ausgeführt und dient Behandlung bzw. Verbesserung des Gesundheitszustands."
  },
  {
    "frage": "12. Warum kann derselbe Arztbesuch unterschiedlichen Formen gesundheitsbezogenen Verhaltens entsprechen?",
    "a": "Weil seine Funktion vom subjektiven bzw. objektiven Gesundheitszustand und dem Anlass des Besuchs abhängt.",
    "b": "Weil ein Arztbesuch immer gleichzeitig Prävention und Therapie ist.",
    "c": "Weil nur die medizinische Fachperson die Verhaltenskategorie bestimmt.",
    "d": "Weil die Einteilung nach Kasl und Cobb keine Gesundheitszustände berücksichtigt.",
    "richtig": "a",
    "begruendung": "Routine-Check-up, Abklärung neuer Symptome und Rezeptverlängerung bei bekannter Krankheit können dasselbe äußere Verhalten darstellen, aber unterschiedliche Funktionen besitzen."
  },
  {
    "frage": "13. Welches Beispiel entspricht nach Rothman et al. einem präventiven Verhalten?",
    "a": "Chemotherapie bei bestehender Krebserkrankung",
    "b": "Hautkrebsscreening",
    "c": "Arztbesuch wegen bereits bestehender Beschwerden",
    "d": "Kondomgebrauch zur Verhinderung einer sexuell übertragbaren Infektion",
    "richtig": "d",
    "begruendung": "Präventiv = eine Erkrankung bzw. gesundheitliche Schädigung verhindern."
  },
  {
    "frage": "14. Welches Beispiel entspricht einem aufdeckenden Verhalten?",
    "a": "Einnahme eines Antibiotikums",
    "b": "Anlegen eines Fahrradhelms",
    "c": "Wahrnehmung einer Hautkrebs-Früherkennungsuntersuchung",
    "d": "Rauchstopp zur Risikoreduktion",
    "richtig": "c",
    "begruendung": "Aufdeckend bedeutet Früherkennung bzw. Entdeckung einer möglicherweise vorhandenen Erkrankung."
  },
  {
    "frage": "15. Welches Beispiel entspricht einem kurativen Verhalten?",
    "a": "Sonnenschutz zur Vermeidung von Hautkrebs",
    "b": "Teilnahme an einem Screening",
    "c": "Adhärenz bei einer Chemotherapie",
    "d": "Anschnallen im Auto",
    "richtig": "c",
    "begruendung": "Kurativ = auf Behandlung einer bereits vorhandenen Krankheit bezogen. Adhärenz bedeutet das Einhalten vereinbarter Behandlungsmaßnahmen."
  },
  {
    "frage": "16. Welche Aussage muss eine umfassende Definition gesundheitsbezogenen Verhaltens berücksichtigen?",
    "a": "Nur wissenschaftlich nachweislich förderliches Verhalten zählt.",
    "b": "Verhalten muss für alle Personengruppen gesundheitlich bedeutsam sein.",
    "c": "Auch Verhalten, das nur bei bestimmten Krankheiten oder bestimmten Personengruppen relevant ist, gehört dazu.",
    "d": "Verhalten zählt nur dann, wenn es bewusst aus gesundheitlicher Motivation ausgeführt wird.",
    "richtig": "c",
    "begruendung": "Die Definition ist absichtlich sehr weit. Motivation, Wirkung, Person und Gesundheitszustand können variieren."
  },
  {
    "frage": "17. Welche der folgenden Gruppen enthält ausschließlich Merkmalsdimensionen nach McEachan et al.?",
    "a": "Motivation, Intention, Selbstwirksamkeit, Norm",
    "b": "Anstrengung, Emotionalität, Häufigkeit, Gewohnheit, Barrieren",
    "c": "Inzidenz, Prävalenz, Mortalität, Morbidität",
    "d": "Primär-, Sekundär-, Tertiär- und Quartärprävention",
    "richtig": "b",
    "begruendung": "McEachan et al. beschreiben konkrete Eigenschaften des Verhaltens selbst."
  },
  {
    "frage": "18. Welches Merkmal beschreibt, ob ein Verhalten routinemäßig und weitgehend automatisch ausgeführt wird?",
    "a": "Gewohnheit",
    "b": "Häufigkeit",
    "c": "Sichtbarkeit von Folgen",
    "d": "Annäherung",
    "richtig": "a",
    "begruendung": "Gewohnheit betrifft die Routinisierung. Häufigkeit und Gewohnheit hängen zusammen, sind aber nicht identisch."
  },
  {
    "frage": "19. Welche Aussage beschreibt die Merkmale „Sichtbarkeit“ und „Zeitdauer angezielter Folgen“ korrekt?",
    "a": "Folgen können unmittelbar sichtbar oder verborgen und kurzfristig oder erst langfristig eintretend sein.",
    "b": "Beide Begriffe bezeichnen dasselbe Merkmal.",
    "c": "Sichtbare Folgen treten grundsätzlich langfristig auf.",
    "d": "Langfristige Folgen sind immer gesundheitlich relevanter.",
    "richtig": "a",
    "begruendung": "Fehlender Sonnenschutz kann z. B. einen kurzfristig sichtbaren Sonnenbrand und ein langfristig zunächst unsichtbares Hautkrebsrisiko haben."
  },
  {

    let currentQuestionIndex = 0;
    let score = 0; 
    let totalPossiblePoints = 0; 
    let userAnswers = {};

    function startQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        totalPossiblePoints = 0;
        userAnswers = {};

        questions.forEach((q, index) => {
            const correctArr = q.richtig.split(',').map(s => s.trim().toLowerCase());
            totalPossiblePoints += correctArr.length;
        });

        document.getElementById('startScreen').classList.remove('active');
        document.getElementById('quizScreen').classList.add('active');
        loadQuestion();
    }

    function loadQuestion() {
        resetState();
        const q = questions[currentQuestionIndex];
        
        document.getElementById('questionCounter').innerText = `Frage ${currentQuestionIndex + 1} / ${questions.length}`;
        document.getElementById('questionText').innerText = q.frage;

        const optionsList = document.getElementById('optionsList');
        const optionsKeys = ['a', 'b', 'c', 'd', 'e'];

        optionsKeys.forEach(key => {
            if (q[key]) {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `${key.toUpperCase()}) ${q[key]}`;
                btn.dataset.key = key;
                btn.onclick = () => toggleOption(btn);
                optionsList.appendChild(btn);
            }
        });

        updateProgress();
    }

    function toggleOption(btn) {
        if (btn.disabled) return;
        btn.classList.toggle('selected');
    }

    function resetState() {
        const optionsList = document.getElementById('optionsList');
        optionsList.innerHTML = '';
        const explanationBox = document.getElementById('explanationBox');
        explanationBox.classList.remove('show');
        explanationBox.innerText = '';
        const actionBtn = document.getElementById('actionBtn');
        actionBtn.innerText = 'Antworten prüfen';
        actionBtn.onclick = handleAction;
    }

    function handleAction() {
        const actionBtn = document.getElementById('actionBtn');
        const q = questions[currentQuestionIndex];
        const selectedButtons = document.querySelectorAll('.option-btn.selected');
        
        if (selectedButtons.length === 0) {
            alert('Bitte wähle mindestens eine Option aus.');
            return;
        }

        const correctArr = q.richtig.split(',').map(s => s.trim().toLowerCase());
        const optionButtons = document.querySelectorAll('.option-btn');

        optionButtons.forEach(btn => {
            btn.disabled = true;
            const key = btn.dataset.key;
            const isSelected = btn.classList.contains('selected');
            const isCorrect = correctArr.includes(key);

            if (isCorrect) {
                btn.classList.add('correct-ans');
                if (isSelected) {
                    score += 1;
                }
            } else {
                if (isSelected) {
                    btn.classList.add('wrong-ans');
                }
            }
        });

        const explanationBox = document.getElementById('explanationBox');
        explanationBox.innerText = "Begründung: " + q.begruendung;
        explanationBox.classList.add('show');

        actionBtn.innerText = 'Nächste Frage';
        actionBtn.onclick = nextQuestion;
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function updateProgress() {
        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        document.getElementById('progressFill').style.width = `${progressPercent}%`;
    }

    function showResults() {
        document.getElementById('quizScreen').classList.remove('active');
        document.getElementById('resultScreen').classList.add('active');
        document.getElementById('progressFill').style.width = '100%';

        const percentage = totalPossiblePoints > 0 ? Math.round((score / totalPossiblePoints) * 100) : 0;

        document.getElementById('resultScore').innerText = `${percentage}%`;

        const statusEl = document.getElementById('resultStatus');
        const detailsEl = document.getElementById('resultDetails');

        if (percentage >= 75) {
            statusEl.innerText = "Bestanden!";
            statusEl.className = "result-status passed";
        } else {
            statusEl.innerText = "Nicht bestanden";
            statusEl.className = "result-status failed";
        }

        detailsEl.innerText = `Du hast ${score} von ${totalPossiblePoints} möglichen Antwort-Punkten richtig erreicht.`;
    }

    function restartQuiz() {
        document.getElementById('resultScreen').classList.remove('active');
        document.getElementById('startScreen').classList.add('active');
    }
</script>
