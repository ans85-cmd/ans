<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MilBox // Lernquiz</title>
  <style>
    :root {
      --bg-dark: #0f130e;
      --bg-panel: #181e16;
      --bg-card: #21291e;
      --border: #364231;
      --olive: #4b5d3b;
      --olive-light: #6b8254;
      --amber: #e09f3e;
      --amber-glow: rgba(224, 159, 62, 0.2);
      --text: #e6eadf;
      --muted: #9aa590;
      --ok: #3fa34d;
      --ok-bg: rgba(63, 163, 77, 0.18);
      --err: #d94848;
      --err-bg: rgba(217, 72, 72, 0.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 24px) 14px;
      background:
        radial-gradient(circle at top, rgba(75, 93, 59, 0.22), transparent 55%),
        var(--bg-dark);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin-top: 10px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-left: 4px solid var(--amber);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 14px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .badge {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--amber);
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 700;
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0 0 6px 0;
      font-size: 22px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .subtitle {
      margin: 0 0 18px 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .stat-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
    }

    .stat-val {
      font-size: 18px;
      font-weight: 800;
      color: var(--amber);
    }

    .stat-lbl {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 2px;
    }

    .progress-wrap {
      margin-bottom: 14px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
      font-variant-numeric: tabular-nums;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--bg-card);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--olive-light), var(--amber));
      transition: width 0.25s ease;
    }

    .question-text {
      font-size: 18px;
      font-weight: 650;
      line-height: 1.42;
      margin: 6px 0 16px 0;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt-btn {
      width: 100%;
      text-align: left;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 14px;
      color: var(--text);
      font-size: 15px;
      line-height: 1.38;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.08s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .opt-btn:active:not(:disabled) {
      transform: scale(0.985);
    }

    .opt-key {
      flex: 0 0 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--bg-panel);
      border: 1px solid var(--olive-light);
      color: var(--amber);
      font-weight: 800;
      font-size: 13px;
      text-transform: uppercase;
      display: grid;
      place-items: center;
      margin-top: 1px;
    }

    .opt-btn.correct {
      background: var(--ok-bg);
      border-color: var(--ok);
    }

    .opt-btn.correct .opt-key {
      background: var(--ok);
      border-color: var(--ok);
      color: #fff;
    }

    .opt-btn.wrong {
      background: var(--err-bg);
      border-color: var(--err);
    }

    .opt-btn.wrong .opt-key {
      background: var(--err);
      border-color: var(--err);
      color: #fff;
    }

    .opt-btn:disabled {
      cursor: default;
      opacity: 0.95;
    }

    .feedback {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.4;
      border: 1px solid var(--border);
      background: var(--bg-card);
    }

    .feedback.ok {
      border-color: var(--ok);
      color: #b7f0bf;
    }

    .feedback.err {
      border-color: var(--err);
      color: #ffb8b8;
    }

    .actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--amber);
      color: #141710;
      box-shadow: 0 4px 18px var(--amber-glow);
    }

    .result-banner {
      text-align: center;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    .result-banner.passed {
      background: var(--ok-bg);
      border-color: var(--ok);
    }

    .result-banner.failed {
      background: var(--err-bg);
      border-color: var(--err);
    }

    .result-status {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .result-pct {
      font-size: 36px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .wrong-list {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .wrong-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--err);
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      line-height: 1.4;
    }

    .wrong-q {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .wrong-yours {
      color: #ff9c9c;
      margin-bottom: 3px;
    }

    .wrong-right {
      color: #9be8a6;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <span>SEKTOR // PRÜFUNGSTRAINING</span>
      <span class="badge" id="poolInfo">LADEN...</span>
    </div>

    <!-- START -->
    <div class="panel" id="startScreen">
      <h1>Einsatz-Check</h1>
      <p class="subtitle">
        Zufällige Auswahl von <strong>30 Fragen</strong>.
        Bestanden ab <strong>70 %</strong>. Direktes Feedback bei jeder Antwort.
      </p>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-val" id="totalPoolVal">-</div>
          <div class="stat-lbl">Fragenpool</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">30</div>
          <div class="stat-lbl">Pro Durchlauf</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">70%</div>
          <div class="stat-lbl">Bestanden</div>
        </div>
      </div>

      <button class="btn btn-primary" id="startBtn" disabled>Quiz starten</button>
      <div class="feedback hidden" id="loadError"></div>
    </div>

    <!-- QUIZ -->
    <div class="panel hidden" id="quizScreen">
      <div class="progress-wrap">
        <div class="progress-meta">
          <span id="qCounter">Frage 1 / 30</span>
          <span id="liveScore">Treffer: 0</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="question-text" id="questionText"></div>
      <div class="options" id="optionsBox"></div>
      <div class="feedback hidden" id="feedbackBox"></div>

      <div class="actions">
        <button class="btn btn-primary hidden" id="nextBtn">Nächste Frage</button>
      </div>
    </div>

    <!-- AUSWERTUNG -->
    <div class="panel hidden" id="resultScreen">
      <div class="result-banner" id="resultBanner">
        <div class="result-status" id="resultStatus"></div>
        <div class="result-pct" id="resultPct"></div>
        <div id="resultSub" style="margin-top:4px; font-size:14px;"></div>
      </div>

      <div id="wrongSection">
        <h2 style="font-size:16px; text-transform:uppercase; letter-spacing:0.05em; margin:0 0 8px 0;">
          Falsch beantwortete Fragen (<span id="wrongCount">0</span>)
        </h2>
        <div class="wrong-list" id="wrongList"></div>
      </div>

      <div class="actions" style="margin-top:20px;">
        <button class="btn btn-primary" id="restartBtn">Neues Zufalls-Quiz</button>
      </div>
    </div>
  </div>

    const QUIZ_LENGTH = 30;
    const PASS_PERCENT = 70;
    const KEYS = ["a", "b", "c", "d"];

    let allQuestions = [];
    let sessionQuestions = [];
    let currentIndex = 0;
    let correctCount = 0;
    let wrongAnswers = [];
    let answered = false;

    const el = {
      poolInfo: document.getElementById("poolInfo"),
      totalPoolVal: document.getElementById("totalPoolVal"),
      startScreen: document.getElementById("startScreen"),
      quizScreen: document.getElementById("quizScreen"),
      resultScreen: document.getElementById("resultScreen"),
      startBtn: document.getElementById("startBtn"),
      loadError: document.getElementById("loadError"),
      qCounter: document.getElementById("qCounter"),
      liveScore: document.getElementById("liveScore"),
      progressFill: document.getElementById("progressFill"),
      questionText: document.getElementById("questionText"),
      optionsBox: document.getElementById("optionsBox"),
      feedbackBox: document.getElementById("feedbackBox"),
      nextBtn: document.getElementById("nextBtn"),
      resultBanner: document.getElementById("resultBanner"),
      resultStatus: document.getElementById("resultStatus"),
      resultPct: document.getElementById("resultPct"),
      resultSub: document.getElementById("resultSub"),
      wrongSection: document.getElementById("wrongSection"),
      wrongCount: document.getElementById("wrongCount"),
      wrongList: document.getElementById("wrongList"),
      restartBtn: document.getElementById("restartBtn")
    };

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function init() {
      try {
        if (!Array.isArray(EMBEDDED_QUESTIONS) || EMBEDDED_QUESTIONS.length === 0) {
          throw new Error("Keine Fragen in EMBEDDED_QUESTIONS gefunden.");
        }
        allQuestions = EMBEDDED_QUESTIONS;
        el.poolInfo.textContent = `${allQuestions.length} FRAGEN BEREIT`;
        el.totalPoolVal.textContent = allQuestions.length;
        el.startBtn.disabled = false;
      } catch (err) {
        el.poolInfo.textContent = "FEHLER";
        el.loadError.classList.remove("hidden");
        el.loadError.classList.add("err");
        el.loadError.innerHTML = `Fehler beim Laden: <strong>${err.message}</strong>`;
      }
    }

    function startQuiz() {
      const count = Math.min(QUIZ_LENGTH, allQuestions.length);
      sessionQuestions = shuffle(allQuestions).slice(0, count);
      currentIndex = 0;
      correctCount = 0;
      wrongAnswers = [];

      el.startScreen.classList.add("hidden");
      el.resultScreen.classList.add("hidden");
      el.quizScreen.classList.remove("hidden");

      renderQuestion();
    }

    function renderQuestion() {
      answered = false;
      const q = sessionQuestions[currentIndex];
      const total = sessionQuestions.length;

      el.qCounter.textContent = `Frage ${currentIndex + 1} / ${total}`;
      el.liveScore.textContent = `Treffer: ${correctCount}`;
      el.progressFill.style.width = `${(currentIndex / total) * 100}%`;
      el.questionText.textContent = q.frage;

      el.feedbackBox.classList.add("hidden");
      el.feedbackBox.className = "feedback hidden";
      el.nextBtn.classList.add("hidden");
      el.nextBtn.textContent = currentIndex === total - 1 ? "Auswertung anzeigen" : "Nächste Frage";

      el.optionsBox.innerHTML = "";
      KEYS.forEach((k) => {
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.dataset.key = k;
        btn.innerHTML = `<span class="opt-key">${k.toUpperCase()}</span><span>${q[k]}</span>`;
        btn.addEventListener("click", () => selectAnswer(k));
        el.optionsBox.appendChild(btn);
      });
    }

    function selectAnswer(chosenKey) {
      if (answered) return;
      answered = true;

      const q = sessionQuestions[currentIndex];
      const rightKey = String(q.richtig || "").toLowerCase().trim();
      const isCorrect = chosenKey === rightKey;

      const buttons = el.optionsBox.querySelectorAll(".opt-btn");
      buttons.forEach((btn) => {
        btn.disabled = true;
        const k = btn.dataset.key;
        if (k === rightKey) btn.classList.add("correct");
        if (k === chosenKey && !isCorrect) btn.classList.add("wrong");
      });

      el.feedbackBox.classList.remove("hidden");
      if (isCorrect) {
        correctCount++;
        el.liveScore.textContent = `Treffer: ${correctCount}`;
        el.feedbackBox.classList.add("ok");
        el.feedbackBox.textContent = "Richtig!";
      } else {
        el.feedbackBox.classList.add("err");
        el.feedbackBox.textContent = `Falsch – richtig wäre ${rightKey.toUpperCase()}: ${q[rightKey]}`;
        wrongAnswers.push({
          frage: q.frage,
          chosenKey,
          chosenText: q[chosenKey],
          rightKey,
          rightText: q[rightKey]
        });
      }

      el.nextBtn.classList.remove("hidden");
    }

    function nextStep() {
      if (currentIndex + 1 < sessionQuestions.length) {
        currentIndex++;
        renderQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      el.progressFill.style.width = "100%";
      el.quizScreen.classList.add("hidden");
      el.resultScreen.classList.remove("hidden");

      const total = sessionQuestions.length;
      const pct = Math.round((correctCount / total) * 100);
      const passed = pct >= PASS_PERCENT;

      el.resultBanner.className = `result-banner ${passed ? "passed" : "failed"}`;
      el.resultStatus.textContent = passed ? "PRÜFUNG BESTANDEN" : "NICHT BESTANDEN";
      el.resultPct.textContent = `${pct} %`;
      el.resultSub.textContent = `${correctCount} von ${total} Fragen richtig (Limit: ${PASS_PERCENT} %)`;

      el.wrongCount.textContent = wrongAnswers.length;
      el.wrongList.innerHTML = "";

      if (wrongAnswers.length === 0) {
        el.wrongList.innerHTML = `<div class="feedback ok">Keine Fehler – saubere Leistung!</div>`;
      } else {
        wrongAnswers.forEach((item) => {
          const div = document.createElement("div");
          div.className = "wrong-item";
          div.innerHTML = `
            <div class="wrong-q">${item.frage}</div>
            <div class="wrong-yours">Deine Antwort (${item.chosenKey.toUpperCase()}): ${item.chosenText}</div>
            <div class="wrong-right">Richtig (${item.rightKey.toUpperCase()}): ${item.rightText}</div>
          `;
          el.wrongList.appendChild(div);
        });
      }
    }

    el.startBtn.addEventListener("click", startQuiz);
    el.nextBtn.addEventListener("click", nextStep);
    el.restartBtn.addEventListener("click", startQuiz);

    init();
  </script>
