<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J]L[M</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f1f5f9;
            --panel-bg: #ffffff;
            
            --primary-blue: #1e3a8a;       
            --primary-blue-hover: #1e40af;
            --accent-gold: #b45309;        
            
            --border-color: #cbd5e1;
            --text-dark: #0f172a;          
            --text-muted: #64748b;
            
            --correct-bg: #ecfdf5;
            --correct-border: #10b981;
            --correct-text: #065f46;
            
            --wrong-bg: #fef2f2;
            --wrong-border: #ef4444;
            --wrong-text: #991b1b;
            
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-card: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(180, 83, 9, 0.04) 0px, transparent 50%);
            background-attachment: fixed;
        }

        /* Fixer Zurück-Button */
        .fixed-back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--primary-blue);
            padding: 8px 14px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
            z-index: 1000;
        }

        .fixed-back-btn:hover {
            background: #eff6ff;
            border-color: var(--primary-blue);
            transform: translateY(-1px);
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
            border-radius: var(--radius-lg);
            padding: 32px 28px;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 18px;
            position: relative;
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.4rem;
            color: var(--primary-blue);
            letter-spacing: 1.5px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            margin-top: 16px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-blue);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .question-meta {
            font-size: 0.75rem;
            color: var(--accent-gold);
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 1.05rem;
            margin-bottom: 22px;
            line-height: 1.6;
            color: var(--text-dark);
            font-weight: 600;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-btn {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            color: var(--text-dark);
            padding: 14px 18px;
            border-radius: var(--radius-md);
            text-align: left;
            font-size: 0.92rem;
            line-height: 1.5;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-blue);
            background: #f1f5f9;
            transform: translateY(-1px);
        }

        .option-btn.selected {
            background: #eff6ff;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 1px var(--primary-blue);
            color: var(--primary-blue);
            font-weight: 500;
        }

        .option-btn.correct-ans {
            background: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            font-weight: 600;
        }

        .option-btn.wrong-ans {
            background: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .cyber-btn {
            width: 100%;
            background: var(--primary-blue);
            border: none;
            color: #ffffff;
            padding: 15px;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.2);
            transition: all 0.2s ease;
        }

        .cyber-btn:hover {
            background: var(--primary-blue-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 10px -1px rgba(30, 58, 138, 0.3);
        }

        .cyber-btn:active {
            transform: translateY(0);
        }

        .explanation {
            font-size: 0.88rem;
            background: #f8fafc;
            border-left: 4px solid var(--primary-blue);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            padding: 14px 16px;
            margin-bottom: 20px;
            color: #334155;
            line-height: 1.5;
            display: none;
        }
        
        .explanation.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-box {
            text-align: center;
            padding: 10px 0;
        }

        .result-score {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 3.5rem;
            margin: 10px 0;
            color: var(--primary-blue);
            font-weight: 800;
        }

        .result-status {
            font-size: 1.15rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .passed {
            color: #059669;
        }

        .failed {
            color: #dc2626;
        }
    </style>
</head>

<div class="app-container">

    <div id="startScreen" class="screen active">
        <div class="question-text" style="text-align: center; margin-top: 10px;">
            Bereit für deine Lernsession?<br><span style="color: var(--primary-blue); font-weight: 700;">Lerneinheit 5</span>
        </div>
        <p style="font-size: 0.88rem; text-align: center; margin-bottom: 28px; color: var(--text-muted); line-height: 1.5;">
            Bestanden ab 75% korrekten Antworten.
        </p>
        <button class="cyber-btn" onclick="startQuiz()">Lernen starten</button>

    <div id="quizScreen" class="screen">

<script>
    const questions = [
  {
    "frage": "Was versteht der Studienbrief unter Persönlichkeit?",
    "a": "Ausschließlich angeborene Eigenschaften eines Menschen",
    "b": "Kurzfristige emotionale Reaktionen auf bestimmte Situationen",
    "c": "Ein relativ stabiles und einzigartiges Muster von Gedanken, Gefühlen und Verhalten",
    "d": "Ausschließlich beobachtbares Verhalten",
    "richtig": "c",
    "begruendung": "Persönlichkeit umfasst Gedanken, Gefühle und Verhalten und beeinflusst die Anpassung an die Umwelt. SB1_K4-Persönlichkeit.pdf\nAK-Falle: Persönlichkeit ist relativ stabil, aber nicht unveränderlich."
  },
  {
    "frage": "Welche Aussage zu den Wirkwegen zwischen Persönlichkeit und Gesundheit ist korrekt?",
    "a": "Persönlichkeit wirkt ausschließlich über physiologische Prozesse.",
    "b": "Mehrere Wirkwege können gleichzeitig miteinander interagieren.",
    "c": "Soziale Prozesse spielen keine Rolle.",
    "d": "Jeder Persönlichkeitseigenschaft kann genau ein Wirkmechanismus zugeordnet werden.",
    "richtig": "b",
    "begruendung": "Kognitive, affektive, behaviorale, soziale und physiologische Prozesse können miteinander zusammenspielen. SB1_K4-Persönlichkeit.pdf\nAK-Falle: Die Modelle schließen sich nicht gegenseitig aus."
  },
  {
    "frage": "Eine Person mit hoher internaler Kontrollüberzeugung hält eine belastende Situation eher für kontrollierbar und schätzt ihre Bewältigungsmöglichkeiten günstig ein. Welcher Wirkweg steht hier im Vordergrund?",
    "a": "Genetischer Wirkweg",
    "b": "Sozialer Wirkweg",
    "c": "Affektiver Wirkweg",
    "d": "Kognitiver Wirkweg",
    "richtig": "d",
    "begruendung": "Entscheidend sind hier Bewertungen und Einschätzungen. Diese können wiederum das Stresserleben beeinflussen. SB1_K4-Persönlichkeit.pdf\nAK-Falle: „Stress“ im Ergebnis macht daraus noch keinen affektiven Mechanismus. Entscheidend ist der vermittelnde Prozess."
  },
  {
    "frage": "Welches Beispiel beschreibt einen affektiven Wirkmechanismus?",
    "a": "Negative Affektivität geht mit häufigeren negativen Gefühlen einher, die körperliche Prozesse ungünstig beeinflussen können.",
    "b": "Gewissenhaftigkeit führt zu weniger Alkoholkonsum.",
    "c": "Optimismus führt zu einem größeren sozialen Netzwerk.",
    "d": "Eine Erkrankung verändert nachträglich die Persönlichkeit.",
    "richtig": "a",
    "begruendung": "Affektive Prozesse betreffen das Erleben und die Regulation von Emotionen. SB1_K4-Persönlichkeit.pdf\nAK-Falle: Verhalten, soziale Beziehungen und Emotionen sind verschiedene Wirkwege."
  },
  {
    "frage": "Welche Zuordnung entspricht dem Studienbrief?",
    "a": "Gewissenhaftigkeit → mehr riskante Sexualpraktiken",
    "b": "Sensation Seeking → weniger Risikoverhalten",
    "c": "Gewissenhaftigkeit → weniger Risikoverhalten",
    "d": "Sensation Seeking → grundsätzlich gesundheitsförderliches Verhalten",
    "richtig": "c",
    "begruendung": "Hohe Gewissenhaftigkeit hängt mit weniger Alkohol-/Drogenkonsum und anderem Risikoverhalten zusammen. Sensation Seeking (Suche nach starken Reizen) dagegen mit mehr riskantem Verhalten. SB1_K4-Persönlichkeit.pdf\nAK-Falle: Die Richtung nicht vertauschen."
  },
  {
    "frage": "Aggressives Verhalten führt dazu, dass andere Menschen weniger Unterstützung anbieten. Persönlichkeit beeinflusst dadurch indirekt die Gesundheit. Welcher Mechanismus liegt vor?",
    "a": "Ausschließlich genetischer Mechanismus",
    "b": "Sozialer Mechanismus über veränderte soziale Beziehungen",
    "c": "Ausschließlich physiologischer Mechanismus",
    "d": "Rückwirkung von Krankheit auf Persönlichkeit",
    "richtig": "b",
    "begruendung": "Verhalten beeinflusst die soziale Umwelt → weniger Unterstützung → möglicher Einfluss auf Gesundheit. SB1_K4-Persönlichkeit.pdf\nAK-Falle: Der erste Schritt ist Verhalten, der gesundheitliche Effekt läuft hier aber über soziale Unterstützung."
  },
  {
    "frage": "Was bedeutet es, wenn Coping den Zusammenhang zwischen Persönlichkeit und Gesundheit mediiert?",
    "a": "Coping verhindert jeden Einfluss der Persönlichkeit.",
    "b": "Coping verstärkt grundsätzlich jeden Zusammenhang.",
    "c": "Persönlichkeit und Gesundheit sind unabhängig voneinander.",
    "d": "Persönlichkeit beeinflusst das Coping, welches wiederum die Gesundheit beeinflusst.",
    "richtig": "d",
    "begruendung": "Ein Mediator (vermittelnder Zwischenschritt) erklärt, wie ein Zusammenhang zustande kommt. SB1_K4-Persönlichkeit.pdf\nAK-Falle: Mediator ≠ Moderator."
  },
  {
    "frage": "Selbstwirksamkeit verändert, wie stark Stress mit ungesundem Ernährungsverhalten zusammenhängt. Welche Rolle übernimmt die Selbstwirksamkeit?",
    "a": "Moderator",
    "b": "Mediator",
    "c": "Outcome",
    "d": "Confounder",
    "richtig": "a",
    "begruendung": "Ein Moderator (Einflussfaktor auf Stärke/Richtung eines Zusammenhangs) verändert, wie stark bzw. unter welchen Bedingungen zwei Variablen zusammenhängen. SB1_K4-Persönlichkeit.pdf\nAK-Falle: Mediator = wie/warum, Moderator = wann/wie stark."
  },
  {
    "frage": "Welche Aussage beschreibt die umgekehrte Wirkrichtung korrekt?",
    "a": "Persönlichkeit verursacht grundsätzlich jede spätere Erkrankung.",
    "b": "Gene beeinflussen ausschließlich Persönlichkeit.",
    "c": "Erkrankungen können Veränderungen von Persönlichkeit, Erleben und Verhalten hervorrufen.",
    "d": "Persönlichkeit bleibt auch bei schweren Erkrankungen grundsätzlich unverändert.",
    "richtig": "c",
    "begruendung": "Beispielsweise können Alzheimer oder depressive Symptome Veränderungen der Persönlichkeit hervorrufen. SB1_K4-Persönlichkeit.pdf\nAK-Falle: Ein Zusammenhang Persönlichkeit ↔ Krankheit sagt noch nichts über die Richtung aus."
  },
  {
    "frage": "Was nimmt das Constitutional-Predisposition-Modell (Modell gemeinsamer genetischer Veranlagung) an?",
    "a": "Persönlichkeit verursacht genetische Veränderungen.",
    "b": "Krankheit verursacht genetische Persönlichkeitseigenschaften.",
    "c": "Persönlichkeit und Krankheit verursachen sich gegenseitig.",
    "d": "Ein gemeinsamer genetischer Faktor kann sowohl Persönlichkeit als auch Krankheitsprozesse beeinflussen.",
    "richtig": "d",
    "begruendung": "Persönlichkeit und Krankheit können gemeinsame biologische/genetische Ursachen haben, ohne sich gegenseitig direkt zu verursachen.\n\nSB1_K4-Persönlichkeit.pdf"
  },
  {
    "frage": "Welches Studiendesign besitzt laut Studienbrief die höchste Qualität zur Untersuchung eines möglichen kausalen Einflusses von Persönlichkeit auf Krankheit?",
    "a": "Querschnittstudie",
    "b": "Fall-Kontroll-Studie",
    "c": "Prospektive Kohortenstudie",
    "d": "Quasi-prospektive Studie",
    "richtig": "c",
    "begruendung": "Die Persönlichkeit wird bei zunächst gesunden Personen erfasst und Krankheit/Mortalität erst später erhoben. Dadurch ist die zeitliche Reihenfolge klar. SB1_K4-Persönlichkeit.pdf\nAK-Falle: Prospektiv ist nicht automatisch ein Experiment – auch das bleibt eine Beobachtungsstudie."
  },
  {
    "frage": "Was ist ein wesentlicher Nachteil prospektiver Kohortenstudien?",
    "a": "Persönlichkeit wird erst nach der Diagnose gemessen.",
    "b": "Sie sind zeit- und kostenintensiv und anfällig für Dropouts.",
    "c": "Es können nur Personen mit bestehender Erkrankung untersucht werden.",
    "d": "Erkrankungen können ausschließlich per Selbstauskunft erhoben werden.",
    "richtig": "b",
    "begruendung": "Lange Laufzeiten erhöhen Kosten und das Risiko von Dropouts (Studienabbrüchen).\n\nSB1_K4-Persönlichkeit.pdf"
  },
  {
    "frage": "Wann wird bei einem quasi-prospektiven Design typischerweise die Persönlichkeit erhoben?",
    "a": "Viele Jahre vor jedem Krankheitsverdacht",
    "b": "Nach gesicherter Diagnose",
    "c": "Gleichzeitig mit einer retrospektiven Befragung nach Genesung",
    "d": "Kurz vor der Diagnose, beispielsweise bei Personen mit Krankheitsverdacht",
    "richtig": "d",
    "begruendung": "Genau das ist gleichzeitig das Problem: Der Verdacht auf eine Erkrankung könnte das Erleben bereits beeinflussen.\n\nSB1_K4-Persönlichkeit.pdf"
  },
  {
    "frage": "Warum erlauben Fall-Kontroll- und Querschnittstudien keine eindeutige Kausalaussage zwischen Persönlichkeit und Erkrankung?",
    "a": "Weil Persönlichkeit erst nach der Diagnose erhoben wird und die Erkrankung die Persönlichkeit bereits verändert haben könnte.",
    "b": "Weil Persönlichkeit grundsätzlich nicht messbar ist.",
    "c": "Weil ausschließlich gesunde Personen untersucht werden.",
    "d": "Weil diese Designs immer Jahrzehnte dauern.",
    "richtig": "a",
    "begruendung": "Ursache und Folge lassen sich dadurch nicht eindeutig trennen. SB1_K4-Persönlichkeit.pdf\nAK-Falle: Zusammenhang ≠ Ursache."
  },
  {
    "frage": "Welches Merkmal gehört typischerweise zum Typ-A-Verhaltensmuster?",
    "a": "geringe Durchsetzungsfähigkeit und starke Emotionsunterdrückung",
    "b": "Gelassenheit und Fokus auf außerberufliche Aktivitäten",
    "c": "Zeitliche Dringlichkeit, Konkurrenzstreben und Ungeduld",
    "d": "ausgeprägte Vermeidung jeder Leistungssituation",
    "richtig": "c",
    "begruendung": "Typ A umfasst unter anderem Zeitdruck, Ehrgeiz, Konkurrenzstreben, Aggressivität, Feindseligkeit und Ungeduld.\n\nSB1_K4-Persönlichkeit.pdf"
  },
  {
    "frage": "Welche Aussage zur Beziehung zwischen Typ A und KHK (koronarer Herzkrankheit) entspricht der heutigen im Studienbrief dargestellten Evidenz am besten?",
    "a": "Sämtliche Typ-A-Merkmale sind starke unabhängige Ursachen von KHK.",
    "b": "Typ A weist keinerlei Zusammenhang mit KHK.",
    "c": "Typ B weist das höchste KHK-Risiko auf.",
    "d": "Vor allem Feindseligkeit scheint die relevante Komponente zu sein, wobei der Effekt eher klein ist.",
    "richtig": "d",
    "begruendung": "Spätere Forschung relativierte den gesamten Typ-A-Effekt. Vor allem Feindseligkeit blieb als Risikofaktor übrig, allerdings mit geringer Effektstärke. SB1_K4-Persönlichkeit.pdf\nAK-Falle: Frühe Studien ≠ heutige Schlussfolgerung."
  },
  {
    "frage": "Welche Komponente der Feindseligkeit scheint für KHK eher relevant zu sein?",
    "a": "Die behaviorale/affektive Komponente mit Ärgerausdruck und aggressivem Verhalten",
    "b": "Ausschließlich zynische Gedanken ohne Verhaltensausdruck",
    "c": "Ausschließlich eine geringe Extraversion",
    "d": "Die Unterdrückung positiven Affekts",
    "richtig": "a",
    "begruendung": "Die Befunde sprechen eher für die behaviorale (verhaltensbezogene) als für die rein kognitive Komponente.\n\nSB1_K4-Persönlichkeit.pdf"
  },
  {

    let currentQuestionIndex = 0;
    let score = 0; 
    let totalPossiblePoints = 0; 
    let userAnswers = {};

    function startQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        totalPossiblePoints = 0;
        userAnswers = {};

        questions.forEach((q, index) => {
            const correctArr = q.richtig.split(',').map(s => s.trim().toLowerCase());
            totalPossiblePoints += correctArr.length;
        });

        document.getElementById('startScreen').classList.remove('active');
        document.getElementById('quizScreen').classList.add('active');
        loadQuestion();
    }

    function loadQuestion() {
        resetState();
        const q = questions[currentQuestionIndex];
        
        document.getElementById('questionCounter').innerText = `Frage ${currentQuestionIndex + 1} / ${questions.length}`;
        document.getElementById('questionText').innerText = q.frage;

        const optionsList = document.getElementById('optionsList');
        const optionsKeys = ['a', 'b', 'c', 'd', 'e'];

        optionsKeys.forEach(key => {
            if (q[key]) {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `${key.toUpperCase()}) ${q[key]}`;
                btn.dataset.key = key;
                btn.onclick = () => toggleOption(btn);
                optionsList.appendChild(btn);
            }
        });

        updateProgress();
    }

    function toggleOption(btn) {
        if (btn.disabled) return;
        btn.classList.toggle('selected');
    }

    function resetState() {
        const optionsList = document.getElementById('optionsList');
        optionsList.innerHTML = '';
        const explanationBox = document.getElementById('explanationBox');
        explanationBox.classList.remove('show');
        explanationBox.innerText = '';
        const actionBtn = document.getElementById('actionBtn');
        actionBtn.innerText = 'Antworten prüfen';
        actionBtn.onclick = handleAction;
    }

    function handleAction() {
        const actionBtn = document.getElementById('actionBtn');
        const q = questions[currentQuestionIndex];
        const selectedButtons = document.querySelectorAll('.option-btn.selected');
        
        if (selectedButtons.length === 0) {
            alert('Bitte wähle mindestens eine Option aus.');
            return;
        }

        const correctArr = q.richtig.split(',').map(s => s.trim().toLowerCase());
        const optionButtons = document.querySelectorAll('.option-btn');

        optionButtons.forEach(btn => {
            btn.disabled = true;
            const key = btn.dataset.key;
            const isSelected = btn.classList.contains('selected');
            const isCorrect = correctArr.includes(key);

            if (isCorrect) {
                btn.classList.add('correct-ans');
                if (isSelected) {
                    score += 1;
                }
            } else {
                if (isSelected) {
                    btn.classList.add('wrong-ans');
                }
            }
        });

        const explanationBox = document.getElementById('explanationBox');
        explanationBox.innerText = "Begründung: " + q.begruendung;
        explanationBox.classList.add('show');

        actionBtn.innerText = 'Nächste Frage';
        actionBtn.onclick = nextQuestion;
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function updateProgress() {
        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        document.getElementById('progressFill').style.width = `${progressPercent}%`;
    }

    function showResults() {
        document.getElementById('quizScreen').classList.remove('active');
        document.getElementById('resultScreen').classList.add('active');
        document.getElementById('progressFill').style.width = '100%';

        const percentage = totalPossiblePoints > 0 ? Math.round((score / totalPossiblePoints) * 100) : 0;

        document.getElementById('resultScore').innerText = `${percentage}%`;

        const statusEl = document.getElementById('resultStatus');
        const detailsEl = document.getElementById('resultDetails');

        if (percentage >= 75) {
            statusEl.innerText = "Bestanden!";
            statusEl.className = "result-status passed";
        } else {
            statusEl.innerText = "Nicht bestanden";
            statusEl.className = "result-status failed";
        }

        detailsEl.innerText = `Du hast ${score} von ${totalPossiblePoints} möglichen Antwort-Punkten richtig erreicht.`;
    }

    function restartQuiz() {
        document.getElementById('resultScreen').classList.remove('active');
        document.getElementById('startScreen').classList.add('active');
    }
</script>
