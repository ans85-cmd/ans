<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J]L[M</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f1f5f9;
            --panel-bg: #ffffff;
            
            --primary-blue: #1e3a8a;       
            --primary-blue-hover: #1e40af;
            --accent-gold: #b45309;        
            
            --border-color: #cbd5e1;
            --text-dark: #0f172a;          
            --text-muted: #64748b;
            
            --correct-bg: #ecfdf5;
            --correct-border: #10b981;
            --correct-text: #065f46;
            
            --wrong-bg: #fef2f2;
            --wrong-border: #ef4444;
            --wrong-text: #991b1b;
            
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-card: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(180, 83, 9, 0.04) 0px, transparent 50%);
            background-attachment: fixed;
        }

        /* Fixer Zurück-Button */
        .fixed-back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--primary-blue);
            padding: 8px 14px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.2s ease;
            z-index: 1000;
        }

        .fixed-back-btn:hover {
            background: #eff6ff;
            border-color: var(--primary-blue);
            transform: translateY(-1px);
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-card);
            border-radius: var(--radius-lg);
            padding: 32px 28px;
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 18px;
            position: relative;
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 1.4rem;
            color: var(--primary-blue);
            letter-spacing: 1.5px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            margin-top: 16px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-blue);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .question-meta {
            font-size: 0.75rem;
            color: var(--accent-gold);
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .question-text {
            font-size: 1.05rem;
            margin-bottom: 22px;
            line-height: 1.6;
            color: var(--text-dark);
            font-weight: 600;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-btn {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            color: var(--text-dark);
            padding: 14px 18px;
            border-radius: var(--radius-md);
            text-align: left;
            font-size: 0.92rem;
            line-height: 1.5;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-blue);
            background: #f1f5f9;
            transform: translateY(-1px);
        }

        .option-btn.selected {
            background: #eff6ff;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 1px var(--primary-blue);
            color: var(--primary-blue);
            font-weight: 500;
        }

        .option-btn.correct-ans {
            background: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            color: var(--correct-text) !important;
            font-weight: 600;
        }

        .option-btn.wrong-ans {
            background: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            color: var(--wrong-text) !important;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .cyber-btn {
            width: 100%;
            background: var(--primary-blue);
            border: none;
            color: #ffffff;
            padding: 15px;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.2);
            transition: all 0.2s ease;
        }

        .cyber-btn:hover {
            background: var(--primary-blue-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 10px -1px rgba(30, 58, 138, 0.3);
        }

        .cyber-btn:active {
            transform: translateY(0);
        }

        .explanation {
            font-size: 0.88rem;
            background: #f8fafc;
            border-left: 4px solid var(--primary-blue);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            padding: 14px 16px;
            margin-bottom: 20px;
            color: #334155;
            line-height: 1.5;
            display: none;
        }
        
        .explanation.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-box {
            text-align: center;
            padding: 10px 0;
        }

        .result-score {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 3.5rem;
            margin: 10px 0;
            color: var(--primary-blue);
            font-weight: 800;
        }

        .result-status {
            font-size: 1.15rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .passed {
            color: #059669;
        }

        .failed {
            color: #dc2626;
        }
    </style>
</head>

                <path d="M 55 -25 C 35 -30, 10 -20, 0 -10 L 0 35 C 10 25, 35 15, 55 20 Z" fill="#f8fafc" opacity="0.9"/>

    <div id="startScreen" class="screen active">
        <div class="question-text" style="text-align: center; margin-top: 10px;">
            Bereit für deine Lernsession?<br><span style="color: var(--primary-blue); font-weight: 700;">Lerneinheit 4</span>

<script>
    const questions = [
{
    "frage": "Was beschreibt den motivationalen Pfad des JD-R-Modells?",
    "a": "Hohe Anforderungen → Engagement",
    "b": "Hohe Anforderungen → geringere Erschöpfung",
    "c": "Ressourcen → Erschöpfung",
    "d": "Ressourcen → Engagement; fehlende Ressourcen → Disengagement",
    "richtig": "d",
    "begruendung": "Engagement (positive Verbundenheit mit der Arbeit) wird durch Ressourcen gefördert; fehlen Ressourcen, steigt Disengagement (Distanzierung bzw. geringes Engagement).\nAK-Falle: Ressourcen gehören zum motivationalen Pfad[cite: 10]."
  },
  {
    "frage": "Unter welcher Konstellation entsteht Burnout nach dem JD-R-Modell besonders?",
    "a": "Hohe Anforderungen + hohe Ressourcen",
    "b": "Hohe Anforderungen + niedrige Ressourcen",
    "c": "Niedrige Anforderungen + niedrige Ressourcen",
    "d": "Niedrige Anforderungen + hohe Ressourcen",
    "richtig": "b",
    "begruendung": "Burnout entsteht im Modell besonders durch die Kombination hoher Anforderungen mit fehlenden bzw. niedrigen Ressourcen[cite: 10].\nAK-Falle: Hohe Anforderungen allein reichen für die Modelllogik nicht aus."
  },
  {
    "frage": "Welche Kombination entspricht der Burnout-Beschreibung der ICD-11 (International Classification of Diseases, 11. Ausgabe)?",
    "a": "Eschöpfung + mentale Distanz/Zynismus + Gefühl von Ineffektivität",
    "b": "Erschöpfung + soziale Isolation + körperliche Schmerzen",
    "c": "Angst + depressive Stimmung + reduzierte Selbstwirksamkeit",
    "d": "Disengagement + mangelnde Belohnung + geringe Kontrolle",
    "richtig": "a",
    "begruendung": "Die ICD-11 beschreibt Burnout als Folge chronischen, nicht erfolgreich bewältigten Arbeitsstresses mit drei genannten Dimensionen[cite: 10].\nAK-Falle: ICD-11-Beschreibung nicht mit den zwei JD-R-Dimensionen Erschöpfung und (Dis-)Engagement vermischen."
  },
  {
    "frage": "Welche Kombination gehört zu den Voraussetzungen einer erfolgreichen Implementierung von BGF?",
    "a": "Standardisierung – Zentralisierung – Individualisierung – Gewinnorientierung",
    "b": "Diagnose – Wettbewerb – Hierarchieabbau – Belohnung",
    "c": "Ganzheitlichkeit – doppelte Zielsetzung – Beteiligung – Prozessorientierung – Diagnose",
    "d": "Partizipation – Gratifikation – Kontrolle – Ressourcenabbau",
    "richtig": "c",
    "begruendung": "BGF soll sowohl Humanität als auch betriebliche Effizienz berücksichtigen, Beschäftigte beteiligen und Veränderungen als Prozess verstehen. Die Diagnose bildet einen Ausgangspunkt[cite: 10].\nAK-Falle: Wieder können echte Begriffe anderer Modelle als Fremdkörper eingebaut werden."
  },
  {
    "frage": "Welches Instrument dient primär der Diagnose des Ist-Zustands und nicht unmittelbar der Umsetzung einer Intervention?",
    "a": "Führungskräfteseminar",
    "b": "Krankenstandsanalyse",
    "c": "Coaching",
    "d": "Teamentwicklung",
    "richtig": "b",
    "begruendung": "Krankenstands-, Unfall-, Gefährdungs- und Belastungsanalysen dienen der Diagnose. Seminare, Coaching und Teamentwicklung zählen eher zur Einführung und Umsetzung von Maßnahmen[cite: 10].\nAK-Falle: Diagnoseinstrument und Interventionsmaßnahme unterscheiden."
  },
  {
    "frage": "Welche Zuordnung der Gesundheitszirkelmodelle ist korrekt?",
    "a": "Berliner Modell = mit allen Stakeholdern; Düsseldorfer Modell = nur Führungskräfte",
    "b": "Beide Modelle schließen grundsätzlich Vorgesetzte aus.",
    "c": "Berliner Modell = ausschließlich Vorgesetzte; Düsseldorfer Modell = Beschäftigte ohne Vorgesetzte",
    "d": "Düsseldorfer Modell = verschiedene Stakeholder inklusive Vorgesetzten; Berliner Modell = eine Hierarchieebene ohne Vorgesetzte",
    "richtig": "d",
    "begruendung": "Der Düsseldorfer Zirkel ist hierarchisch gemischt, während das Berliner Modell ohne Vorgesetzte auf einer Hierarchieebene arbeitet[cite: 10].\nAK-Falle: Düsseldorf mit – Berlin ohne Vorgesetzte."
  },
  {
    "frage": "Was meint der strukturelle Widerspruch an Hochschulen?",
    "a": "Die Verwaltung verfügt über flache Hierarchien, die Wissenschaft über eine strenge Bürokratie.",
    "b": "Forschung und Lehre sind organisatorisch vollständig voneinander getrennt.",
    "c": "Wissenschaftsbereiche weisen eher flache Hierarchien auf, während die Verwaltung bürokratisch-hierarchisch organisiert ist.",
    "d": "Studierende und Beschäftigte haben dieselben Aufgaben und Mitwirkungsrechte.",
    "richtig": "c",
    "begruendung": "Unterschiedliche Organisationslogiken von Wissenschaft und Verwaltung bilden den strukturellen Widerspruch[cite: 10].\nAK-Falle: Wissenschaft und Verwaltung nicht vertauschen."
  },
  {
    "frage": "Welche Zuordnung von Statusgruppe und gesundheitsrelevantem Merkmal ist korrekt?",
    "a": "Wissenschaftliches Personal: Sinnhaftigkeit, Identifikation und Entscheidungs-/Handlungsspielräume können Gesundheitsressourcen darstellen.",
    "b": "Studierende: Befristete Arbeitsverträge bilden den zentralen studienspezifischen Stressor.",
    "c": "Nichtwissenschaftliches Personal: Prüfungsangst ist die zentrale Belastung.",
    "d": "Wissenschaftliches Personal: Es liegen besonders viele eindeutige empirische Befunde vor.",
    "richtig": "a",
    "begruendung": "Beim wissenschaftlichen Personal gelten Sinnhaftigkeit, Identifikation und Handlungsspielräume als Ressourcen; Belastungen sind u. a. Betreuungsdruck und prekäre Beschäftigungsbedingungen.\nAK-Falle: Belastungen der drei Statusgruppen nicht durcheinanderwerfen."
  },
  {
    "frage": "Welche Aussage beschreibt eine gesundheitsfördernde Hochschule gemäß den Gütekriterien am besten?",
    "a": "Sie setzt primär auf individuelle Gesundheitskurse ohne strukturelle Veränderungen.",
    "b": "Gesundheitsförderung wird unabhängig von der Hochschulpolitik organisiert.",
    "c": "Sie verzichtet auf Vernetzung, um hochschulspezifisch zu bleiben.",
    "d": "Sie verbindet Setting- und Ressourcenorientierung mit Partizipation, Verhaltens- und Verhältnismaßnahmen, Nachhaltigkeit, Evaluation und Vernetzung.",
    "richtig": "d",
    "begruendung": "Gesundheitsförderung soll als strukturelle Querschnittsaufgabe in die Hochschule integriert werden[cite: 10].\nAK-Falle: Setting-Ansatz = nicht bloß einzelne Personen „gesünder machen“."
  },
  {
    "frage": "Welches Ziel gehört zu Healthy Campus Bonn?",
    "a": "Ausschließlich krankgeschriebene Beschäftigte wieder einzugliedern",
    "b": "Gesundheitskompetenz und einen nachhaltigen gesundheits- und bewegungsbezogenen Lebensstil von Universitätsangehörigen zu fördern",
    "c": "Ausschließlich die psychische Gesundheit Studierender zu behandeln",
    "d": "Betriebliche Gesundheitsförderung durch gesetzliche Gefährdungsbeurteilungen zu ersetzen",
    "richtig": "b",
    "begruendung": "Healthy Campus Bonn umfasst Angebote u. a. zu Bewegung, Ernährung und psychischer Gesundheit und richtet sich an unterschiedliche Universitätsangehörige.\nAK-Falle: Das Programm ist nicht auf eine einzelne Statusgruppe oder einen einzigen Gesundheitsbereich beschränkt."
  },
  {
    "frage": "Was war ein zentrales Ziel des GFS-Projekts („Die Gesundheit Fernstudierender stärken“)?",
    "a": "Die Übertragbarkeit klassischer Arbeitsplatzmodelle auf Präsenzstudierende zu prüfen",
    "b": "Fernstudierende ausschließlich zu körperlicher Aktivität zu motivieren",
    "c": "Fernstudienspezifische Belastungen empirisch zu untersuchen und daraus angepasste digitale Gesundheitsförderung abzuleiten",
    "d": "Die Gesundheitsangebote der FernUniversität vollständig durch Präsenzkurse zu ersetzen",
    "richtig": "c",
    "begruendung": "Die Maßnahmen sollten an den spezifischen Kontext des Fernstudiums angepasst, gemeinsam mit der Zielgruppe entwickelt und niederschwellig sowie barrierefrei sein.\nAK-Falle: GFS = nicht einfach allgemeine Studierendengesundheit, sondern Fernstudium-spezifisch."
  },
  {
    "frage": "Welche Belastung spielte im ersten Gesundheitssurvey des GFS-Projekts eine besonders wichtige Rolle?",
    "a": "Zeitmangel und die Vereinbarkeit von Studium, Beruf und Familie bzw. sozialem Leben",
    "b": "Ausschließlich fehlende körperliche Bewegung",
    "c": "Primär Konflikte mit Lehrenden im Präsenzunterricht",
    "d": "Ausschließlich finanzielle Belastungen durch Studiengebühren",
    "richtig": "a",
    "begruendung": "Besonders wichtig waren Zeitmangel, Leistungsdruck und Mehrfachbelastungen. Aus der Bedarfsanalyse wurde unter anderem das app- und webbasierte Stressbewältigungsprogramm Stressdown entwickelt.\nAK-Falle: Der Schwerpunkt des GFS-Projekts liegt stark auf Mehrfachbelastung und Stressbewältigung."
  },
  {
    "frage": "Welche Aussage zum JD-R-Modell (Job Demands-Resources-Modell; Anforderungs-Ressourcen-Modell) ist korrekt?",
    "a": "Erschöpfung entsteht ausschließlich dann, wenn gleichzeitig Disengagement vorliegt.",
    "b": "Engagement und Erschöpfung stellen zwei Ausprägungen derselben Dimension dar.",
    "c": "Erschöpfung und (Dis-)Engagement entstehen im Modell unabhängig voneinander und vermitteln den Einfluss von Anforderungen bzw. Ressourcen auf gesundheitliche und arbeitsbezogene Ergebnisse.",
    "d": "Anforderungen und Ressourcen wirken ausschließlich direkt auf Gesundheit und Leistung.",
    "richtig": "c",
    "begruendung": "Das JD-R-Modell unterscheidet einen gesundheitsbeeinträchtigenden und einen motivationalen Pfad. Erschöpfung und (Dis-)Engagement mediieren (vermitteln als Zwischenprozess) den Einfluss von Anforderungen und Ressourcen auf verschiedene Outcomes (Ergebnisse). Die breite Definition von Anforderungen und Ressourcen ermöglicht außerdem die Anwendung in verschiedenen Branchen und Hierarchieebenen.\nAK-Falle: Erschöpfung und Disengagement müssen nicht gemeinsam entstehen."
  },
  {
    "frage": "Welche Aussage zur erfolgreichen Einführung von BGF entspricht dem Studienbrief?",
    "a": "Die Humanität der Arbeitsgestaltung soll zugunsten betrieblicher Effizienz nachrangig behandelt werden.",
    "b": "BGF verfolgt eine doppelte Zielsetzung aus Effizienz der Betriebsführung und Humanität der Arbeitsgestaltung; die Diagnose bildet den Ausgangspunkt der Veränderung.",
    "c": "Für erfolgreiche BGF existiert ein einheitliches Maßnahmenpaket, das auf alle Betriebe übertragen werden kann.",
    "d": "Eine Diagnose sollte erst nach der Einführung der Gesundheitsmaßnahmen erfolgen.",
    "richtig": "b",
    "begruendung": "Neben Ganzheitlichkeit, Beteiligung und Prozessorientierung (Veränderung als gemeinsamer Entwicklungsprozess) nennt the Studienbrief die doppelte Zielsetzung und die Diagnose als Ausgangspunkt. Aufgrund unterschiedlicher finanzieller, personeller und organisatorischer Bedingungen gibt es keine einheitlichen Maßnahmen für alle Betriebe.\nAK-Falle: „One size fits all“ gilt bei BGF gerade nicht."
  },
  {
    "frage": "Welche Zuordnung zum BGM (Betriebliches Gesundheitsmanagement) ist korrekt?",
    "a": "BEM = weiterer Sinn; Organisationsentwicklung = engerer Sinn",
    "b": "Arbeitsgestaltung = engerer Sinn; Fehlzeitenmanagement = weiterer Sinn",

    let currentQuestionIndex = 0;
    let score = 0; 
    let totalPossiblePoints = 0; 
    let userAnswers = {};

    function startQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        totalPossiblePoints = 0;
        userAnswers = {};

        questions.forEach((q, index) => {
            const correctArr = q.richtig.split(',').map(s => s.trim().toLowerCase());
            totalPossiblePoints += correctArr.length;
        });

        document.getElementById('startScreen').classList.remove('active');
        document.getElementById('quizScreen').classList.add('active');
        loadQuestion();
    }

    function loadQuestion() {
        resetState();
        const q = questions[currentQuestionIndex];
        
        document.getElementById('questionCounter').innerText = `Frage ${currentQuestionIndex + 1} / ${questions.length}`;
        document.getElementById('questionText').innerText = q.frage;

        const optionsList = document.getElementById('optionsList');
        const optionsKeys = ['a', 'b', 'c', 'd', 'e'];

        optionsKeys.forEach(key => {
            if (q[key]) {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `${key.toUpperCase()}) ${q[key]}`;
                btn.dataset.key = key;
                btn.onclick = () => toggleOption(btn);
                optionsList.appendChild(btn);
            }
        });

        updateProgress();
    }

    function toggleOption(btn) {
        if (btn.disabled) return;
        btn.classList.toggle('selected');
    }

    function resetState() {
        const optionsList = document.getElementById('optionsList');
        optionsList.innerHTML = '';
        const explanationBox = document.getElementById('explanationBox');
        explanationBox.classList.remove('show');
        explanationBox.innerText = '';
        const actionBtn = document.getElementById('actionBtn');
        actionBtn.innerText = 'Antworten prüfen';
        actionBtn.onclick = handleAction;
    }

    function handleAction() {
        const actionBtn = document.getElementById('actionBtn');
        const q = questions[currentQuestionIndex];
        const selectedButtons = document.querySelectorAll('.option-btn.selected');
        
        if (selectedButtons.length === 0) {
            alert('Bitte wähle mindestens eine Option aus.');
            return;
        }

        const correctArr = q.richtig.split(',').map(s => s.trim().toLowerCase());
        const optionButtons = document.querySelectorAll('.option-btn');

        optionButtons.forEach(btn => {
            btn.disabled = true;
            const key = btn.dataset.key;
            const isSelected = btn.classList.contains('selected');
            const isCorrect = correctArr.includes(key);

            if (isCorrect) {
                btn.classList.add('correct-ans');
                if (isSelected) {
                    score += 1;
                }
            } else {
                if (isSelected) {
                    btn.classList.add('wrong-ans');
                }
            }
        });

        const explanationBox = document.getElementById('explanationBox');
        explanationBox.innerText = "Begründung: " + q.begruendung;
        explanationBox.classList.add('show');

        actionBtn.innerText = 'Nächste Frage';
        actionBtn.onclick = nextQuestion;
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function updateProgress() {
        const progressPercent = ((currentQuestionIndex) / questions.length) * 100;
        document.getElementById('progressFill').style.width = `${progressPercent}%`;
    }

    function showResults() {
        document.getElementById('quizScreen').classList.remove('active');
        document.getElementById('resultScreen').classList.add('active');
        document.getElementById('progressFill').style.width = '100%';

        const percentage = totalPossiblePoints > 0 ? Math.round((score / totalPossiblePoints) * 100) : 0;

        document.getElementById('resultScore').innerText = `${percentage}%`;

        const statusEl = document.getElementById('resultStatus');
        const detailsEl = document.getElementById('resultDetails');

        if (percentage >= 75) {
            statusEl.innerText = "Bestanden!";
            statusEl.className = "result-status passed";
        } else {
            statusEl.innerText = "Nicht bestanden";
            statusEl.className = "result-status failed";
        }

        detailsEl.innerText = `Du hast ${score} von ${totalPossiblePoints} möglichen Antwort-Punkten richtig erreicht.`;
    }

    function restartQuiz() {
        document.getElementById('resultScreen').classList.remove('active');
        document.getElementById('startScreen').classList.add('active');
    }
</script>
